<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Physical Rhythm Visualizer v3</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background: #000;
  color: #fff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  display: flex;
  flex-direction: column;
  align-items: center;

  padding: 30px 15px;
}

h1 {
  font-size: 15px;
  letter-spacing: .08em;
  margin: 0 0 6px;
}

.subtitle {
  color: #aaa;
  font-size: 11px;
  text-align: center;
  margin-bottom: 28px;
}


/* =========================
   VISUALIZER
========================= */

.visualizer {

  width: min(1000px, 100%);

  display: grid;

  grid-template-columns:
    repeat(6, minmax(90px, 1fr));

  gap: 18px;

  align-items: end;
}


.person {

  display: flex;
  flex-direction: column;
  align-items: center;

}


.name {

  font-size: 14px;
  font-weight: 700;

  margin-bottom: 3px;

}


.type {

  height: 30px;

  color: #aaa;

  font-size: 10px;

  text-align: center;

  line-height: 1.4;

}


.values {

  height: 35px;

  margin: 8px 0;

  font-size: 10px;

  line-height: 1.5;

  text-align: center;

  color: #ddd;

  font-variant-numeric:
    tabular-nums;

}


/* =========================
   TRACK
========================= */

.track {

  position: relative;

  width: 62px;
  height: 240px;

  background: #241d1a;

  border: 1px solid #4a3b35;

  border-radius: 999px;

  overflow: hidden;

}


/* 中央の薄い基準線 */

.track::after {

  content: "";

  position: absolute;

  left: 8px;
  right: 8px;

  top: 50%;

  height: 1px;

  background:
    rgba(255,255,255,.12);

}


/* =========================
   MOVING CAPSULE
========================= */

.mover {

  position: absolute;

  left: 50%;

  bottom: 12px;

  width: 48px;
  height: 68px;

  margin-left: -24px;

  border-radius: 999px;

  background: #ece5db;

  will-change:
    transform;

}


/* =========================
   CONTROLS
========================= */

.controls {

  margin-top: 28px;

  display: flex;

  flex-wrap: wrap;

  align-items: center;
  justify-content: center;

  gap: 12px;

  padding: 14px 20px;

  background: #111;

  border:
    1px solid #333;

  border-radius: 28px;

}


button {

  padding: 8px 20px;

  border: none;

  border-radius: 20px;

  background: #ece5db;

  color: #000;

  font-weight: 700;

  cursor: pointer;

}


button.secondary {

  background: #222;

  color: #fff;

  border:
    1px solid #444;

}


label {

  display: flex;

  align-items: center;

  gap: 8px;

  color: #ddd;

  font-size: 11px;

}


input[type="range"] {

  width: 130px;

  accent-color: #ece5db;

}


.time {

  width: 90px;

  text-align: center;

  font-size: 11px;

  color: #ccc;

  font-variant-numeric:
    tabular-nums;

}


/* =========================
   LEGEND
========================= */

.legend {

  width: min(900px,100%);

  margin-top: 20px;

  padding: 14px 18px;

  background: #0b0b0b;

  border: 1px solid #222;

  border-radius: 16px;

  color: #aaa;

  font-size: 11px;

  line-height: 1.7;

  text-align: center;

}


@media(max-width:760px) {

  .visualizer {

    grid-template-columns:
      repeat(3,1fr);

    row-gap: 30px;

  }

  .track {

    height: 200px;

  }

}

</style>
</head>


<body>


<h1>
PHYSICAL RHYTHM PROFILE v3
</h1>


<div class="subtitle">

白いカプセルの上下速度 = Tempo　
／　
上下幅 = Intensity　
／　
動き方 = Rhythm

</div>


<div
  class="visualizer"
  id="visualizer">
</div>


<div class="controls">

<button id="play">
Play
</button>


<button
  id="reset"
  class="secondary">

Reset

</button>


<label>

再生速度

<input
  id="speed"
  type="range"
  min=".5"
  max="3"
  step=".25"
  value="1">

<span id="speedText">
1×
</span>

</label>


<div
  class="time"
  id="time">

0.0 / 60s

</div>

</div>


<div class="legend">

T = Tempo（T1〜T7）　
／　
I = Intensity（I1〜I10）

<br>

全員同じ60秒を
「立ち上がり → 巡航 → 昂進 → Peak → Cooldown」
として再生します。

</div>



<script>

/* ========================================
   PROFILE
======================================== */

const profiles = [

{
  id:"naoto",
  name:"直人",
  type:"安定制御",
  baseT:3.7,
  peakT:5.0,
  baseI:4.7,
  peakI:6.0,
  rhythm:"steady"
},

{
  id:"kei",
  name:"慧",
  type:"高強度持続",
  baseT:4.6,
  peakT:6.0,
  baseI:6.7,
  peakI:9.0,
  rhythm:"hold"
},

{
  id:"shoma",
  name:"翔馬",
  type:"急加速ピーク",
  baseT:4.6,
  peakT:7.0,
  baseI:6.6,
  peakI:8.0,
  rhythm:"burst"
},

{
  id:"minato",
  name:"湊",
  type:"反応追従",
  baseT:3.8,
  peakT:5.8,
  baseI:5.5,
  peakI:7.0,
  rhythm:"responsive"
},

{
  id:"haruki",
  name:"晴輝",
  type:"状態変動",
  baseT:3.7,
  peakT:6.0,
  baseI:5.5,
  peakI:8.0,
  rhythm:"variable"
},

{
  id:"hyunwoo",
  name:"ヒョヌ",
  type:"高密度制御",
  baseT:3.6,
  peakT:5.6,
  baseI:6.6,
  peakI:8.0,
  rhythm:"controlled"
}

];



/* ========================================
   CREATE UI
======================================== */

const visualizer =
document.getElementById("visualizer");


profiles.forEach(p => {

const person =
document.createElement("div");

person.className =
"person";


person.innerHTML = `

<div class="name">
${p.name}
</div>

<div class="type">
${p.type}
</div>

<div
  class="values"
  id="${p.id}-values">

T ${p.baseT.toFixed(1)}
/
I ${p.baseI.toFixed(1)}

<br>

待機

</div>

<div class="track">

<div
  class="mover"
  id="${p.id}-mover">
</div>

</div>

`;


visualizer.appendChild(
person
);

});



/* ========================================
   HELPERS
======================================== */

function clamp(
value,
min,
max
){

return Math.max(
min,
Math.min(max,value)
);

}


function lerp(
a,
b,
t
){

return (
a +
(b-a)*t
);

}


function smooth(
a,
b,
x
){

let t =
clamp(
(x-a)/(b-a),
0,
1
);

return (
t*t*(3-2*t)
);

}



/* ========================================
   PROFILE STATE
======================================== */

function getState(
p,
time
){

let tempo =
p.baseT;

let intensity =
p.baseI;


/*
  0–10
  warm up

  10–32
  cruise / rise

  32–48
  peak

  48–60
  cooldown
*/


const warm =
smooth(
0,
10,
time
);


const rise =
smooth(
10,
32,
time
);


const peak =

smooth(
30,
38,
time
)

*

(
1 -
smooth(
48,
56,
time
)
);


const cooldown =
smooth(
48,
60,
time
);


/* initial */

tempo =
lerp(
Math.max(
1,
p.baseT-.7
),
p.baseT,
warm
);


intensity =
lerp(
Math.max(
1,
p.baseI-1
),
p.baseI,
warm
);



/* ========================================
   PERSON DIFFERENCES
======================================== */


/* ---------- NAOTO ---------- */

if(
p.rhythm ===
"steady"
){

tempo +=
rise*.45;

intensity +=
rise*.35;

tempo +=
peak*.45;

intensity +=
peak*.55;

}


/* ---------- KEI ---------- */

if(
p.rhythm ===
"hold"
){

/*
  徐々に上がって
  高い状態へ
*/

tempo +=
rise*.7;

intensity +=
rise*1.15;


const hold =

smooth(
25,
34,
time
)

*

(
1 -
smooth(
52,
60,
time
)
);


tempo +=
hold*.55;

intensity +=
hold*1.25;

}


/* ---------- SHOMA ---------- */

if(
p.rhythm ===
"burst"
){

tempo +=
rise*.5;

intensity +=
rise*.45;


const burst =

Math.max(
0,
Math.sin(
(time-13)*.65
)
);


tempo +=
burst*1.25;

intensity +=
burst*.65;


if(
time>32 &&
time<47
){

const peakBurst =

Math.max(
0,
Math.sin(
(time-32)*1.15
)
);


tempo +=
peakBurst*1.25;

intensity +=
peakBurst*.65;

}

}


/* ---------- MINATO ---------- */

if(
p.rhythm ===
"responsive"
){

tempo +=
rise*.35;

intensity +=
rise*.3;


tempo +=

Math.sin(
time*.45
)*.35

+

Math.sin(
time*1.05
)*.18;


intensity +=

Math.sin(
time*.38
)*.28;


tempo +=
peak*.45;

intensity +=
peak*.5;

}


/* ---------- HARUKI ---------- */

if(
p.rhythm ===
"variable"
){

const condition =

.5 +

.5 *
Math.sin(
time*.16 + 2
);


tempo +=

rise *
(
.25 +
condition*.55
);


intensity +=

rise *
(
.25 +
condition*.65
);


tempo +=
peak *
(
.3 +
condition*.55
);


intensity +=
peak *
(
.35 +
condition*.7
);

}


/* ---------- HYUNWOO ---------- */

if(
p.rhythm ===
"controlled"
){

tempo +=
rise*.35;

intensity +=
rise*.65;


tempo +=
peak*.55;

intensity +=
peak*.65;


/*
  少し緩急
*/

tempo +=

Math.sin(
time*.24
)*.22;

}



/* ========================================
   COOLDOWN
======================================== */

if(
cooldown>0
){

tempo =
lerp(
tempo,
Math.max(
1,
p.baseT-.8
),
cooldown
);


intensity =
lerp(
intensity,
Math.max(
2,
p.baseI*.65
),
cooldown
);

}


/* LIMIT */

tempo =
clamp(
tempo,
1,
p.peakT
);


intensity =
clamp(
intensity,
1,
p.peakI
);



let stage;


if(time<10){

stage =
"立ち上がり";

}

else if(time<30){

stage =
"巡航";

}

else if(time<48){

stage =
"Peak帯";

}

else{

stage =
"Cooldown";

}


return {
tempo,
intensity,
stage
};

}



/* ========================================
   RHYTHM SHAPE
======================================== */

function getWave(
profile,
phase
){

const sine =
Math.sin(phase);


/*
  直人

  滑らかで一定
*/

if(
profile.rhythm ===
"steady"
){

return sine;

}


/*
  慧

  大きく滑らか。
  切り返しを少し重くする。
*/

if(
profile.rhythm ===
"hold"
){

return (

Math.sign(sine)

*

Math.pow(
Math.abs(sine),
.82
)

);

}


/*
  翔馬

  切り返しが速い。
*/

if(
profile.rhythm ===
"burst"
){

return (

Math.sign(sine)

*

Math.pow(
Math.abs(sine),
.52
)

);

}


/*
  湊

  小さな変化が混ざる。
*/

if(
profile.rhythm ===
"responsive"
){

return clamp(

sine*.78

+

Math.sin(
phase*1.7
)*.22,

-1,
1

);

}


/*
  晴輝

  一定になりきらない。
*/

if(
profile.rhythm ===
"variable"
){

return clamp(

sine*.82

+

Math.sin(
phase*.47
)*.18,

-1,
1

);

}


/*
  ヒョヌ

  意図的な緩急。
*/

if(
profile.rhythm ===
"controlled"
){

return (

Math.sin(

phase

+

.28 *
Math.sin(
phase*.5
)

)

);

}


return sine;

}



/* ========================================
   ANIMATION
======================================== */

let playing =
false;

let animationID =
null;

let startTime =
0;

let previousTime =
0;

let elapsed =
0;

let speed =
1;


const duration =
60;


/*
  人物ごとに位相を保持。

  Tempoが途中で変化しても
  動きが飛ばないようにする。
*/

const phases = {};

profiles.forEach(
p => {

phases[p.id] =
0;

});


const playButton =
document.getElementById(
"play"
);


const resetButton =
document.getElementById(
"reset"
);


const speedSlider =
document.getElementById(
"speed"
);


const speedText =
document.getElementById(
"speedText"
);


const timeText =
document.getElementById(
"time"
);



speedSlider.addEventListener(
"input",
() => {

speed =
parseFloat(
speedSlider.value
);

speedText.textContent =
speed + "×";

}
);



function animate(
now
){

if(
!playing
){

return;

}


if(
previousTime === 0
){

previousTime =
now;

}


const realDelta =

(now-previousTime)
/1000;


previousTime =
now;


const delta =

realDelta *
speed;


elapsed +=
delta;


if(
elapsed >
duration
){

elapsed =
duration;

}


/* EACH PERSON */

profiles.forEach(
p => {

const state =
getState(
p,
elapsed
);


/*
  Tempo → cycles/sec

  T1 ≈ 0.45 Hz
  T4 ≈ 1.05 Hz
  T7 ≈ 1.65 Hz

  数字自体は表示用の
  視覚変換。
*/

const frequency =

.25

+

state.tempo *
.20;


/*
  位相を積分するので
  Tempo変化時も
  動きが連続する。
*/

phases[p.id] +=

Math.PI *
2 *
frequency *
delta;


/*
  人物別の波形
*/

const wave =
getWave(
p,
phases[p.id]
);


/*
  -1〜1
  ↓
  0〜1
*/

const position =
(wave+1)/2;


/*
  Intensity → 上下幅

  I5なら約70px
  I9なら約118px程度
*/

const amplitude =

10

+

state.intensity *
12;


/*
  position 0 = 下
  position 1 = 上
*/

const y =

position *
amplitude;


const mover =

document.getElementById(
p.id+"-mover"
);


mover.style.transform =

`translateY(${-y}px)`;



const values =

document.getElementById(
p.id+"-values"
);


values.innerHTML =

`T ${state.tempo.toFixed(1)}
 /
 I ${state.intensity.toFixed(1)}

<br>

${state.stage}`;

});


timeText.textContent =

elapsed.toFixed(1)
+
" / "
+
duration
+
"s";


if(
elapsed >=
duration
){

playing =
false;

playButton.textContent =
"Replay";

previousTime =
0;

return;

}


animationID =
requestAnimationFrame(
animate
);

}



/* ========================================
   PLAY
======================================== */

playButton.addEventListener(
"click",
() => {


/* replay */

if(
elapsed >= duration
){

resetAll();

}


playing =
!playing;


if(
playing
){

playButton.textContent =
"Pause";

previousTime =
0;

animationID =
requestAnimationFrame(
animate
);

}

else{

playButton.textContent =
"Play";

cancelAnimationFrame(
animationID
);

previousTime =
0;

}

});



/* ========================================
   RESET
======================================== */

function resetAll(){

playing =
false;


cancelAnimationFrame(
animationID
);


elapsed =
0;

previousTime =
0;


profiles.forEach(
p => {

phases[p.id] =
0;


const mover =

document.getElementById(
p.id+"-mover"
);


mover.style.transform =
"translateY(0px)";


const values =

document.getElementById(
p.id+"-values"
);


values.innerHTML =

`T ${p.baseT.toFixed(1)}
 /
 I ${p.baseI.toFixed(1)}

<br>

待機`;

});


timeText.textContent =
"0.0 / 60s";


playButton.textContent =
"Play";

}



resetButton.addEventListener(
"click",
resetAll
);


resetAll();

</script>

</body>
</html>
