<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Physical Rhythm Visualizer v4
</title>


<style>

* {
  box-sizing: border-box;
}


:root {

  --background: #000;

  --panel: #111;

  --track: #362a26;

  --track-border: #4a3b35;

  --fill: #ece5db;

  --text-muted: #aaa;

}


/* ===============================
   BODY
=============================== */

body {

  margin: 0;

  min-height: 100vh;

  background: var(--background);

  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  display: flex;

  flex-direction: column;

  align-items: center;

  padding:

    28px
    16px
    50px;

}


h1 {

  margin:

    0
    0
    6px;

  font-size: 15px;

  letter-spacing: .08em;

}


.subtitle {

  margin-bottom: 22px;

  color: var(--text-muted);

  font-size: 11px;

  line-height: 1.6;

  text-align: center;

}



/* ===============================
   PERSON FILTER
=============================== */

.filter-panel {

  width:

    min(
      1000px,
      100%
    );

  margin-bottom: 28px;

  padding: 13px 17px;

  display: flex;

  flex-wrap: wrap;

  gap: 10px 16px;

  justify-content: center;

  align-items: center;

  background: #0d0d0d;

  border:

    1px solid
    #292929;

  border-radius: 18px;

}


.person-check {

  display: flex;

  gap: 5px;

  align-items: center;

  font-size: 12px;

  cursor: pointer;

}


.person-check input {

  accent-color: #ece5db;

}


#toggleAll {

  padding:

    6px
    13px;

  background: #222;

  color: white;

  border:

    1px solid
    #444;

  border-radius: 15px;

  font-size: 11px;

  cursor: pointer;

}



/* ===============================
   VISUALIZER
=============================== */

.visualizer {

  width:

    min(
      1000px,
      100%
    );

  display: flex;

  flex-wrap: wrap;

  justify-content: center;

  align-items: flex-end;

  gap: 22px;

}


.person {

  width: 130px;

  display: flex;

  flex-direction: column;

  align-items: center;

  transition:

    opacity
    .15s ease;

}


.person.hidden {

  display: none;

}


.name {

  margin-bottom: 3px;

  font-size: 14px;

  font-weight: 700;

}


.type {

  height: 30px;

  font-size: 10px;

  line-height: 1.4;

  text-align: center;

  color: var(--text-muted);

}


.values {

  height: 38px;

  margin:

    7px
    0;

  color: #ddd;

  font-size: 10px;

  line-height: 1.5;

  text-align: center;

  font-variant-numeric:
    tabular-nums;

}



/* ===============================
   CAPSULE TRACK
=============================== */

.track {

  position: relative;

  width: 60px;

  height: 245px;

  overflow: hidden;

  background:

    var(--track);

  border:

    1px solid
    var(--track-border);

  border-radius: 999px;

}


/*
  50% guideline
*/

.track::after {

  content: "";

  position: absolute;

  z-index: 3;

  left: 8px;

  right: 8px;

  top: 50%;

  height: 1px;

  background:

    rgba(
      255,
      255,
      255,
      .11
    );

}


/* ===============================
   STRETCHING WHITE CAPSULE
=============================== */

.fill {

  position: absolute;

  left: 6px;

  right: 6px;

  bottom: 6px;

  height: 30px;

  background:

    var(--fill);

  border-radius: 999px;

  /*
    bottom stays fixed.
    Only height changes.
  */

  will-change: height;

}



/* ===============================
   CONTROLS
=============================== */

.controls {

  margin-top: 28px;

  padding:

    14px
    20px;

  display: flex;

  flex-wrap: wrap;

  justify-content: center;

  align-items: center;

  gap: 13px;

  background:

    var(--panel);

  border:

    1px solid
    #333;

  border-radius: 28px;

}


button {

  padding:

    8px
    19px;

  border: none;

  border-radius: 20px;

  background:

    #ece5db;

  color: black;

  font-weight: 700;

  cursor: pointer;

}


button.secondary {

  background: #222;

  color: white;

  border:

    1px solid
    #444;

}


.duration-control {

  display: flex;

  align-items: center;

  gap: 8px;

  color: #ddd;

  font-size: 11px;

}


#duration {

  width: 68px;

  padding:

    5px
    7px;

  border:

    1px solid
    #444;

  border-radius: 8px;

  background: #181818;

  color: white;

  text-align: right;

}


.time {

  width: 100px;

  color: #ccc;

  font-size: 11px;

  text-align: center;

  font-variant-numeric:
    tabular-nums;

}



/* ===============================
   LEGEND
=============================== */

.legend {

  width:

    min(
      900px,
      100%
    );

  margin-top: 18px;

  padding:

    13px
    18px;

  background: #0b0b0b;

  border:

    1px solid
    #222;

  border-radius: 16px;

  color: #aaa;

  font-size: 11px;

  line-height: 1.7;

  text-align: center;

}


@media (
  max-width: 650px
) {

  .person {

    width: 95px;

  }


  .track {

    width: 54px;

    height: 205px;

  }

}

</style>
</head>



<body>


<h1>
PHYSICAL RHYTHM PROFILE v4
</h1>


<div class="subtitle">

伸縮速度 = Tempo　

／　

伸縮幅 = Intensity　

／　

変化パターン = Rhythm

</div>



<!-- ===============================
     FILTER
================================ -->

<div
  class="filter-panel"
  id="filterPanel"
>

<button id="toggleAll">
全員
</button>

</div>



<!-- ===============================
     VISUALIZER
================================ -->

<div
  class="visualizer"
  id="visualizer"
>
</div>



<!-- ===============================
     CONTROLS
================================ -->

<div class="controls">


<button id="play">
Play
</button>


<button
  id="reset"
  class="secondary"
>
Reset
</button>


<div class="duration-control">

総時間

<input
  id="duration"
  type="number"
  min="20"
  max="180"
  step="5"
  value="60"
>

秒

</div>


<div
  class="time"
  id="time"
>

0.0 / 60s

</div>


</div>



<div class="legend">

T = Tempo（1〜7）　
／　
I = Intensity（1〜10）

<br>

白いカプセルの下端は固定され、
上端だけが伸び縮みします。

<br>

総時間を変更しても、
立ち上がり・巡航・Peak・Cooldownの
相対的な構成は維持されます。

</div>



<script>


/* ======================================
   PROFILE
====================================== */

const profiles = [


{
  id: "naoto",

  name: "直人",

  type: "安定制御",

  baseT: 3.7,

  peakT: 5.0,

  baseI: 4.7,

  peakI: 6.0,

  rhythm: "steady"
},


{
  id: "kei",

  name: "慧",

  type: "高強度持続",

  baseT: 4.6,

  peakT: 6.0,

  baseI: 6.7,

  peakI: 9.0,

  rhythm: "hold"
},


{
  id: "shoma",

  name: "翔馬",

  type: "急加速ピーク",

  baseT: 4.6,

  peakT: 7.0,

  baseI: 6.6,

  peakI: 8.0,

  rhythm: "burst"
},


{
  id: "minato",

  name: "湊",

  type: "反応追従",

  baseT: 3.8,

  peakT: 5.8,

  baseI: 5.5,

  peakI: 7.0,

  rhythm: "responsive"
},


{
  id: "haruki",

  name: "晴輝",

  type: "状態変動",

  baseT: 3.7,

  peakT: 6.0,

  baseI: 5.5,

  peakI: 8.0,

  rhythm: "variable"
},


{
  id: "hyunwoo",

  name: "ヒョヌ",

  type: "高密度制御",

  baseT: 3.6,

  peakT: 5.6,

  baseI: 6.6,

  peakI: 8.0,

  rhythm: "controlled"
}

];



/* ======================================
   CREATE UI
====================================== */

const visualizer =
  document.getElementById(
    "visualizer"
  );


const filterPanel =
  document.getElementById(
    "filterPanel"
  );


profiles.forEach(
  profile => {


    /* PERSON */

    const person =
      document.createElement(
        "div"
      );


    person.className =
      "person";


    person.id =
      profile.id +
      "-person";


    person.innerHTML = `

      <div class="name">

        ${profile.name}

      </div>


      <div class="type">

        ${profile.type}

      </div>


      <div
        class="values"
        id="${profile.id}-values"
      >

        T ${profile.baseT.toFixed(1)}

        /

        I ${profile.baseI.toFixed(1)}

        <br>

        待機

      </div>


      <div class="track">


        <div
          class="fill"
          id="${profile.id}-fill"
        >
        </div>


      </div>

    `;


    visualizer.appendChild(
      person
    );



    /* CHECKBOX */

    const label =
      document.createElement(
        "label"
      );


    label.className =
      "person-check";


    label.innerHTML = `

      <input
        type="checkbox"
        class="person-checkbox"
        data-person="${profile.id}"
        checked
      >

      ${profile.name}

    `;


    filterPanel.appendChild(
      label
    );

});


/* ======================================
   FILTER
====================================== */

const checkboxes =

  Array.from(

    document.querySelectorAll(
      ".person-checkbox"
    )

  );


function updateVisibility() {


  checkboxes.forEach(
    checkbox => {


      const id =
        checkbox.dataset.person;


      const person =
        document.getElementById(
          id + "-person"
        );


      person.classList.toggle(
        "hidden",
        !checkbox.checked
      );

    }
  );

}


checkboxes.forEach(
  checkbox => {


    checkbox.addEventListener(
      "change",
      updateVisibility
    );

});


const toggleAll =
  document.getElementById(
    "toggleAll"
  );


toggleAll.addEventListener(
  "click",
  () => {


    /*
      If all are checked:
      → uncheck everything.

      Otherwise:
      → check everything.
    */

    const allChecked =

      checkboxes.every(
        checkbox =>
          checkbox.checked
      );


    checkboxes.forEach(
      checkbox => {


        checkbox.checked =
          !allChecked;

      }
    );


    updateVisibility();

});


updateVisibility();



/* ======================================
   HELPERS
====================================== */

function clamp(
  value,
  min,
  max
) {

  return Math.max(

    min,

    Math.min(
      max,
      value
    )

  );

}


function lerp(
  a,
  b,
  t
) {

  return (

    a +

    (
      b -
      a
    )

    *

    t

  );

}


function smooth(
  a,
  b,
  x
) {

  const t =

    clamp(

      (
        x -
        a
      )

      /

      (
        b -
        a
      ),

      0,

      1

    );


  return (

    t *

    t *

    (
      3 -
      2 *
      t
    )

  );

}



/* ======================================
   PROFILE STATE

   Here we use progress 0–1 instead
   of fixed seconds.
====================================== */

function getState(
  profile,
  progress
) {


  let tempo;

  let intensity;



  /*
    Timeline

    0–15%
      warmup

    15–50%
      cruise / rise

    50–80%
      peak

    80–100%
      cooldown
  */


  const warm =

    smooth(

      0,

      .15,

      progress

    );


  const rise =

    smooth(

      .15,

      .52,

      progress

    );


  const peak =

    smooth(

      .48,

      .62,

      progress

    )

    *

    (

      1 -

      smooth(

        .80,

        .92,

        progress

      )

    );


  const cooldown =

    smooth(

      .80,

      1,

      progress

    );



  tempo =

    lerp(

      Math.max(
        1,
        profile.baseT - .7
      ),

      profile.baseT,

      warm

    );


  intensity =

    lerp(

      Math.max(
        1,
        profile.baseI - 1
      ),

      profile.baseI,

      warm

    );



/* ======================================
   NAOTO
====================================== */

if (
  profile.rhythm ===
  "steady"
) {

  tempo +=
    rise *
    .45;


  intensity +=
    rise *
    .35;


  tempo +=
    peak *
    .45;


  intensity +=
    peak *
    .55;

}



/* ======================================
   KEI
====================================== */

if (
  profile.rhythm ===
  "hold"
) {


  tempo +=
    rise *
    .7;


  intensity +=
    rise *
    1.15;


  const hold =

    smooth(

      .42,

      .56,

      progress

    )

    *

    (

      1 -

      smooth(

        .87,

        1,

        progress

      )

    );


  tempo +=
    hold *
    .55;


  intensity +=
    hold *
    1.25;

}



/* ======================================
   SHOMA
====================================== */

if (
  profile.rhythm ===
  "burst"
) {


  tempo +=
    rise *
    .5;


  intensity +=
    rise *
    .45;


  const burst =

    Math.max(

      0,

      Math.sin(

        progress *
        Math.PI *
        8

      )

    );


  tempo +=
    burst *
    1.1 *
    rise;


  intensity +=
    burst *
    .55 *
    rise;


  if (
    progress >
    .52
    &&
    progress <
    .8
  ) {


    const peakBurst =

      Math.max(

        0,

        Math.sin(

          (
            progress -
            .52
          )

          *

          Math.PI *

          19

        )

      );


    tempo +=
      peakBurst *
      1.25;


    intensity +=
      peakBurst *
      .65;

  }

}



/* ======================================
   MINATO
====================================== */

if (
  profile.rhythm ===
  "responsive"
) {


  tempo +=
    rise *
    .35;


  intensity +=
    rise *
    .3;


  tempo +=

    Math.sin(

      progress *
      Math.PI *
      7

    )

    *

    .32;


  tempo +=

    Math.sin(

      progress *
      Math.PI *
      16

    )

    *

    .15;


  intensity +=

    Math.sin(

      progress *
      Math.PI *
      6

    )

    *

    .25;


  tempo +=
    peak *
    .45;


  intensity +=
    peak *
    .5;

}



/* ======================================
   HARUKI
====================================== */

if (
  profile.rhythm ===
  "variable"
) {


  const condition =

    .5

    +

    .5 *

    Math.sin(

      progress *
      Math.PI *
      3

      +

      2

    );


  tempo +=

    rise *

    (
      .25 +
      condition *
      .55
    );


  intensity +=

    rise *

    (
      .25 +
      condition *
      .65
    );


  tempo +=

    peak *

    (
      .3 +
      condition *
      .55
    );


  intensity +=

    peak *

    (
      .35 +
      condition *
      .7
    );

}



/* ======================================
   HYUNWOO
====================================== */

if (
  profile.rhythm ===
  "controlled"
) {


  tempo +=
    rise *
    .35;


  intensity +=
    rise *
    .65;


  tempo +=
    peak *
    .55;


  intensity +=
    peak *
    .65;


  tempo +=

    Math.sin(

      progress *
      Math.PI *
      4

    )

    *

    .2;

}



/* ======================================
   COOLDOWN
====================================== */

if (
  cooldown >
  0
) {


  tempo =

    lerp(

      tempo,

      Math.max(
        1,
        profile.baseT -
        .8
      ),

      cooldown

    );


  intensity =

    lerp(

      intensity,

      Math.max(
        2,
        profile.baseI *
        .65
      ),

      cooldown

    );

}


/* limits */

tempo =

  clamp(

    tempo,

    1,

    profile.peakT

  );


intensity =

  clamp(

    intensity,

    1,

    profile.peakI

  );


let stage;


if (
  progress <
  .15
) {

  stage =
    "立ち上がり";

}

else if (
  progress <
  .5
) {

  stage =
    "巡航";

}

else if (
  progress <
  .8
) {

  stage =
    "Peak帯";

}

else {

  stage =
    "Cooldown";

}


return {

  tempo,

  intensity,

  stage

};

}



/* ======================================
   RHYTHM WAVE
====================================== */

function getWave(
  profile,
  phase
) {


  const sine =
    Math.sin(
      phase
    );


/* Naoto */

if (
  profile.rhythm ===
  "steady"
) {

  return sine;

}


/* Kei */

if (
  profile.rhythm ===
  "hold"
) {

  return (

    Math.sign(
      sine
    )

    *

    Math.pow(

      Math.abs(
        sine
      ),

      .82

    )

  );

}


/* Shoma */

if (
  profile.rhythm ===
  "burst"
) {

  return (

    Math.sign(
      sine
    )

    *

    Math.pow(

      Math.abs(
        sine
      ),

      .52

    )

  );

}


/* Minato */

if (
  profile.rhythm ===
  "responsive"
) {

  return clamp(

    sine *
    .78

    +

    Math.sin(

      phase *
      1.7

    )

    *
    .22,

    -1,

    1

  );

}


/* Haruki */

if (
  profile.rhythm ===
  "variable"
) {

  return clamp(

    sine *
    .82

    +

    Math.sin(

      phase *
      .47

    )

    *
    .18,

    -1,

    1

  );

}


/* Hyunwoo */

if (
  profile.rhythm ===
  "controlled"
) {

  return (

    Math.sin(

      phase

      +

      .28 *

      Math.sin(

        phase *
        .5

      )

    )

  );

}


return sine;

}



/* ======================================
   PLAYBACK
====================================== */

let playing =
  false;


let animationID =
  null;


let previousRealTime =
  0;


let elapsed =
  0;


let duration =
  60;


const phases = {};


profiles.forEach(
  profile => {

    phases[
      profile.id
    ] = 0;

  }
);



const playButton =

  document.getElementById(
    "play"
  );


const resetButton =

  document.getElementById(
    "reset"
  );


const durationInput =

  document.getElementById(
    "duration"
  );


const timeDisplay =

  document.getElementById(
    "time"
  );



durationInput.addEventListener(
  "change",
  () => {


    let value =

      parseFloat(
        durationInput.value
      );


    value =

      clamp(
        value,
        20,
        180
      );


    duration =
      value;


    durationInput.value =
      duration;


    if (
      elapsed >
      duration
    ) {

      elapsed =
        duration;

    }


    updateTimeDisplay();

  }
);



function updateTimeDisplay() {


  timeDisplay.textContent =

    elapsed.toFixed(1)

    +

    " / "

    +

    duration

    +

    "s";

}



/* ======================================
   ANIMATION
====================================== */

function animate(
  now
) {


  if (
    !playing
  ) {

    return;

  }


  if (
    previousRealTime ===
    0
  ) {

    previousRealTime =
      now;

  }


  const delta =

    (
      now -
      previousRealTime
    )

    /

    1000;


  previousRealTime =
    now;


  elapsed +=
    delta;


  if (
    elapsed >
    duration
  ) {

    elapsed =
      duration;

  }



  const progress =

    clamp(

      elapsed /
      duration,

      0,

      1

    );



  profiles.forEach(
    profile => {


      const state =

        getState(

          profile,

          progress

        );


      /*
        Tempo → actual visual frequency.

        This does NOT depend on
        total movie length.
      */

      const frequency =

        .25

        +

        state.tempo *
        .20;


      phases[
        profile.id
      ] +=

        Math.PI

        *

        2

        *

        frequency

        *

        delta;



      const wave =

        getWave(

          profile,

          phases[
            profile.id
          ]

        );



      /*
        Convert -1..1
        to 0..1
      */

      const position =

        (
          wave +
          1
        )

        /

        2;



      /*
        Intensity determines
        MAX extension range.
      */

      const minimumHeight =
        30;


      const maximumExtension =

        18

        +

        state.intensity *
        18;



      const currentHeight =

        minimumHeight

        +

        position

        *

        maximumExtension;



      const fill =

        document.getElementById(

          profile.id +
          "-fill"

        );


      fill.style.height =

        currentHeight +
        "px";



      const values =

        document.getElementById(

          profile.id +
          "-values"

        );


      values.innerHTML =

        `T ${state.tempo.toFixed(1)}
         /
         I ${state.intensity.toFixed(1)}

         <br>

         ${state.stage}`;

    }
  );


  updateTimeDisplay();



  if (
    elapsed >=
    duration
  ) {


    playing =
      false;


    previousRealTime =
      0;


    playButton.textContent =
      "Replay";


    return;

  }


  animationID =

    requestAnimationFrame(
      animate
    );

}



/* ======================================
   PLAY / PAUSE
====================================== */

playButton.addEventListener(
  "click",
  () => {


    if (
      elapsed >=
      duration
    ) {

      resetAll();

    }


    playing =
      !playing;


    if (
      playing
    ) {


      playButton.textContent =
        "Pause";


      previousRealTime =
        0;


      animationID =

        requestAnimationFrame(
          animate
        );

    }


    else {


      playButton.textContent =
        "Play";


      cancelAnimationFrame(
        animationID
      );


      previousRealTime =
        0;

    }

  }
);



/* ======================================
   RESET
====================================== */

function resetAll() {


  playing =
    false;


  cancelAnimationFrame(
    animationID
  );


  elapsed =
    0;


  previousRealTime =
    0;


  profiles.forEach(
    profile => {


      phases[
        profile.id
      ] = 0;


      const fill =

        document.getElementById(

          profile.id +
          "-fill"

        );


      fill.style.height =
        "30px";


      const values =

        document.getElementById(

          profile.id +
          "-values"

        );


      values.innerHTML =

        `T ${profile.baseT.toFixed(1)}
         /
         I ${profile.baseI.toFixed(1)}

         <br>

         待機`;

    }
  );


  updateTimeDisplay();


  playButton.textContent =
    "Play";

}



resetButton.addEventListener(
  "click",
  resetAll
);


resetAll();

</script>

</body>

</html>
