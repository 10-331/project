=========================== */

/* ===========================

.controls{

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


/* =========================================================
   PROFILE
========================================================= */

const profiles = [

{
  id:"naoto",
  name:"直人",
  type:"安定制御",
  baseT:3.7,
  peakT:5.0,
  baseI:4.7,
  peakI:6.0,
  variation:.14,
  rhythm:"steady"
},

{
  id:"kei",
  name:"慧",
  type:"高強度持続",
  baseT:4.6,
  peakT:6.0,
  baseI:6.7,
  peakI:9.0,
  variation:.18,
  rhythm:"hold"
},

{
  id:"shoma",
  name:"翔馬",
  type:"急加速ピーク",
  baseT:4.6,
  peakT:7.0,
  baseI:6.6,
  peakI:8.0,
  variation:.40,
  rhythm:"burst"
},

{
  id:"minato",
  name:"湊",
  type:"反応追従",
  baseT:3.8,
  peakT:5.8,
  baseI:5.5,
  peakI:7.0,
  variation:.32,
  rhythm:"responsive"
},

{
  id:"haruki",
  name:"晴輝",
  type:"状態変動",
  baseT:3.7,
  peakT:6.0,
  baseI:5.5,
  peakI:8.0,
  variation:.48,
  rhythm:"variable"
},

{
  id:"hyunwoo",
  name:"ヒョヌ",
  type:"高密度制御",
  baseT:3.6,
  peakT:5.6,
  baseI:6.6,
  peakI:8.0,
  variation:.16,
  rhythm:"controlled"
}

];


/* =========================================================
   DOM
========================================================= */

const playButton =
document.getElementById("play");

const resetButton =
document.getElementById("reset");

const recordButton =
document.getElementById("record");

const toggleAllButton =
document.getElementById("toggleAll");

const durationInput =
document.getElementById("duration");

const timeline =
document.getElementById("timeline");

const sessionMode =
document.getElementById("sessionMode");

const seedInput =
document.getElementById("seed");

const newSessionButton =
document.getElementById("newSession");

const status =
document.getElementById("status");

const chips =
Array.from(
 document.querySelectorAll(".person-chip")
);


/* =========================================================
   STATE
========================================================= */

let duration = 60;

let elapsed = 0;

let playing = false;

let previousTimestamp = 0;

let animationID = null;

let phases = {};

let recorder = null;

let recordedChunks = [];

let recording = false;


/* =========================================================
   HELPERS
========================================================= */

function clamp(v,a,b){
  return Math.max(
    a,
    Math.min(b,v)
  );
}


function lerp(a,b,t){
  return a+(b-a)*t;
}


function smooth(a,b,x){

  const t =
  clamp(
    (x-a)/(b-a),
    0,
    1
  );

  return t*t*(3-2*t);
}


function roundRect(
  context,
  x,
  y,
  width,
  height,
  radius
){

  const r =
  Math.min(
    radius,
    width/2,
    height/2
  );

  context.beginPath();

  context.roundRect(
    x,
    y,
    width,
    height,
    r
  );
}


/* =========================================================
   SEEDED RANDOM
========================================================= */

function hashString(str){

  let h =
  2166136261;

  for(
    let i=0;
    i<str.length;
    i++
  ){

    h ^=
    str.charCodeAt(i);

    h =
    Math.imul(
      h,
      16777619
    );
  }

  return h>>>0;
}


function seededRandom(
  seed,
  key
){

  let x =
  hashString(
    seed+"-"+key
  );

  x +=
  0x6D2B79F5;

  x =
  Math.imul(
    x^(x>>>15),
    x|1
  );

  x ^=
  x+
  Math.imul(
    x^(x>>>7),
    x|61
  );

  return (
    (
      x^(x>>>14)
    )>>>0
  ) / 4294967296;
}


/* =========================================================
   SESSION VARIATION
========================================================= */

function sessionNoise(
  profile,
  progress,
  channel
){

  if(
    sessionMode.value==="fixed"
  ){
    return 0;
  }

  const seed =
  parseInt(
    seedInput.value
  ) || 1;

  const a =
  seededRandom(
    seed,
    profile.id+
    channel+
    "A"
  ) * Math.PI*2;

  const b =
  seededRandom(
    seed,
    profile.id+
    channel+
    "B"
  ) * Math.PI*2;

  const wave1 =
  Math.sin(
    progress*Math.PI*5+a
  );

  const wave2 =
  Math.sin(
    progress*Math.PI*11+b
  )*.30;

  return (
    wave1+
    wave2
  )
  *
  profile.variation;
}


/* =========================================================
   SESSION TIMING

   Wind-down is mostly fixed in real seconds.
========================================================= */

function getTiming(){

  /*
    Short session:
      ~6s wind-down

    Long session:
      max ~10s wind-down

    So 180 sec never becomes
    36 sec of cooldown.
  */

  const windDownSeconds =
  clamp(
    5+
    duration*.025,
    6,
    10
  );

  const startSeconds =
  clamp(
    duration*.10,
    4,
    12
  );

  const activeStart =
  startSeconds /
  duration;

  const windStart =
  (
    duration-
    windDownSeconds
  ) / duration;

  return {
    activeStart,
    windStart,
    windDownSeconds
  };
}


/* =========================================================
   PHRASE GENERATOR

   Longer sessions = more mid-session waves.
========================================================= */

function phraseWave(
  profile,
  progress
){

  const timing =
  getTiming();

  const activeStart =
  timing.activeStart;

  const windStart =
  timing.windStart;


  if(
    progress<
    activeStart
  ){
    return 0;
  }

  if(
    progress>
    windStart
  ){
    return 0;
  }


  const activeProgress =

  (
    progress-
    activeStart
  )

  /

  (
    windStart-
    activeStart
  );


  /*
    Longer duration means
    more phrases.
  */

  const phraseCount =
  clamp(
    Math.round(
      duration/28
    ),
    2,
    9
  );


  const x =
  activeProgress *
  phraseCount *
  Math.PI *
  2;


  if(
    profile.rhythm==="steady"
  ){

    return (
      .42+
      .18*
      Math.sin(
        x*.45
      )
    );

  }


  if(
    profile.rhythm==="hold"
  ){

    return (
      .50+
      .28*
      Math.max(
        0,
        Math.sin(
          x*.30-.8
        )
      )
    );

  }


  if(
    profile.rhythm==="burst"
  ){

    return (
      .30+
      .55*
      Math.max(
        0,
        Math.sin(
          x*.78
        )
      )
    );

  }


  if(
    profile.rhythm==="responsive"
  ){

    return (
      .35+
      .28*
      Math.sin(
        x*.52
      )
      +
      .12*
      Math.sin(
        x*1.14
      )
    );

  }


  if(
    profile.rhythm==="variable"
  ){

    return (
      .32+
      .34*
      Math.sin(
        x*.41+1.3
      )
    );

  }


  if(
    profile.rhythm==="controlled"
  ){

    return (
      .45+
      .22*
      Math.sin(
        x*.34
      )
      +
      .10*
      Math.sin(
        x*.12+1
      )
    );

  }


  return .4;
}


/* =========================================================
   PROFILE STATE
========================================================= */

function getState(
  profile,
  progress
){

  const timing =
  getTiming();

  const activeStart =
  timing.activeStart;

  const windStart =
  timing.windStart;


  /*
    START
  */

  const warm =
  smooth(
    0,
    activeStart,
    progress
  );


  let tempo =
  lerp(
    Math.max(
      1,
      profile.baseT-.8
    ),
    profile.baseT,
    warm
  );


  let intensity =
  lerp(
    Math.max(
      1,
      profile.baseI-1.2
    ),
    profile.baseI,
    warm
  );


  /*
    ACTIVE REGION
  */

  const active =

  smooth(
    activeStart,
    activeStart+.12,
    progress
  )

  *

  (
    1-
    smooth(
      windStart-.05,
      windStart,
      progress
    )
  );


  const phrase =
  phraseWave(
    profile,
    progress
  );


  /* NAOTO */

  if(
    profile.rhythm==="steady"
  ){

    tempo +=
    active*
    (
      .25+
      phrase*.55
    );

    intensity +=
    active*
    (
      .20+
      phrase*.75
    );
  }


  /* KEI */

  if(
    profile.rhythm==="hold"
  ){

    tempo +=
    active*
    (
      .40+
      phrase*.70
    );

    intensity +=
    active*
    (
      .70+
      phrase*1.65
    );
  }


  /* SHOMA */

  if(
    profile.rhythm==="burst"
  ){

    tempo +=
    active*
    (
      .35+
      phrase*1.55
    );

    intensity +=
    active*
    (
      .40+
      phrase*.95
    );
  }


  /* MINATO */

  if(
    profile.rhythm==="responsive"
  ){

    tempo +=
    active*
    (
      .25+
      phrase*.85
    );

    intensity +=
    active*
    (
      .25+
      phrase*.75
    );
  }


  /* HARUKI */

  if(
    profile.rhythm==="variable"
  ){

    tempo +=
    active*
    (
      .22+
      phrase*.95
    );

    intensity +=
    active*
    (
      .25+
      phrase*1.05
    );
  }


  /* HYUNWOO */

  if(
    profile.rhythm==="controlled"
  ){

    tempo +=
    active*
    (
      .25+
      phrase*.60
    );

    intensity +=
    active*
    (
      .60+
      phrase*.95
    );
  }


  /*
    NATURAL SESSION
  */

  tempo +=
  sessionNoise(
    profile,
    progress,
    "T"
  );


  intensity +=
  sessionNoise(
    profile,
    progress,
    "I"
  );


  /*
    WIND-DOWN

    Actual movement shrinks quickly.
  */

  let movementScale =
  1;


  if(
    progress>=
    windStart
  ){

    const windProgress =

    (
      progress-
      windStart
    )

    /

    (
      1-
      windStart
    );


    /*
      Strongly compress motion
      near the end.
    */

    movementScale =
    1-
    smooth(
      0,
      .78,
      windProgress
    );


    tempo =
    lerp(
      tempo,
      1.3,
      smooth(
        0,
        .75,
        windProgress
      )
    );


    intensity =
    lerp(
      intensity,
      1.5,
      smooth(
        0,
        .72,
        windProgress
      )
    );


    /*
      Last ~15% of wind-down:
      effectively stopped.
    */

    if(
      windProgress>.85
    ){

      movementScale =
      0;

    }
  }


  tempo =
  clamp(
    tempo,
    1,
    profile.peakT
  );


  intensity =
  clamp(
    intensity,
    1,
    profile.peakI
  );


  let stage;


  if(
    progress<
    activeStart
  ){

    stage =
    "START";

  }

  else if(
    progress<
    windStart
  ){

    if(
      phrase>.70
    ){
      stage="PEAK";
    }

    else if(
      phrase>.48
    ){
      stage="RISE";
    }

    else{
      stage="CRUISE";
    }

  }

  else{

    stage =
    "WIND-DOWN";

  }


  return {
    tempo,
    intensity,
    stage,
    movementScale
  };
}


/* =========================================================
   MOTION SHAPE
========================================================= */

function motionWave(
  profile,
  phase
){

  const s =
  Math.sin(
    phase
  );


  if(
    profile.rhythm==="steady"
  ){

    return s;
  }


  if(
    profile.rhythm==="hold"
  ){

    return (
      Math.sign(s)*
      Math.pow(
        Math.abs(s),
        .82
      )
    );
  }


  if(
    profile.rhythm==="burst"
  ){

    return (
      Math.sign(s)*
      Math.pow(
        Math.abs(s),
        .50
      )
    );
  }


  if(
    profile.rhythm==="responsive"
  ){

    return clamp(

      s*.78

      +

      Math.sin(
        phase*1.7
      )*.22,

      -1,
      1
    );
  }


  if(
    profile.rhythm==="variable"
  ){

    return clamp(

      s*.82

      +

      Math.sin(
        phase*.47
      )*.18,

      -1,
      1
    );
  }


  if(
    profile.rhythm==="controlled"
  ){

    return Math.sin(

      phase

      +

      .28*
      Math.sin(
        phase*.5
      )
    );
  }


  return s;
}


/* =========================================================
   SELECTED PEOPLE
========================================================= */

function selectedProfiles(){

  const ids =

  chips
  .filter(
    chip =>
    chip.classList.contains(
      "active"
    )
  )
  .map(
    chip =>
    chip.dataset.person
  );


  return profiles.filter(
    profile =>
    ids.includes(
      profile.id
    )
  );
}


/* =========================================================
   CHIP CONTROLS
========================================================= */

function updateAllButton(){

  const allActive =
  chips.every(
    chip =>
    chip.classList.contains(
      "active"
    )
  );


  toggleAllButton
  .classList
  .toggle(
    "active",
    allActive
  );
}


chips.forEach(
  chip=>{

    chip.addEventListener(
      "click",
      ()=>{

        chip
        .classList
        .toggle(
          "active"
        );

        updateAllButton();

        draw();
      }
    );

  }
);


toggleAllButton.addEventListener(
  "click",
  ()=>{

    const allActive =
    chips.every(
      chip =>
      chip.classList.contains(
        "active"
      )
    );


    chips.forEach(
      chip=>{

        chip
        .classList
        .toggle(
          "active",
          !allActive
        );

      }
    );


    updateAllButton();

    draw();
  }
);


updateAllButton();


/* =========================================================
   LAYOUT
========================================================= */

function getLayout(
  count,
  width
){

  /*
    Avoid huge gaps when
    only 1–3 people are selected.
  */

  let maxSpan;


  if(count===1){

    maxSpan =
    240;
  }

  else if(count===2){

    maxSpan =
    430;
  }

  else if(count===3){

    maxSpan =
    620;
  }

  else if(count===4){

    maxSpan =
    760;
  }

  else{

    maxSpan =
    width-110;
  }


  const span =
  Math.min(
    maxSpan,
    width-80
  );


  let trackWidth;


  if(count===1){

    trackWidth=108;
  }

  else if(count===2){

    trackWidth=94;
  }

  else if(count===3){

    trackWidth=86;
  }

  else{

    trackWidth=74;
  }


  let trackHeight;


  if(count===1){

    trackHeight=390;
  }

  else if(count===2){

    trackHeight=370;
  }

  else{

    trackHeight=340;
  }


  return {
    span,
    trackWidth,
    trackHeight
  };
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

  const W =
  canvas.width;

  const H =
  canvas.height;


  ctx.fillStyle="#000";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  const selected =
  selectedProfiles();


  /* TITLE */

  ctx.textAlign="center";

  ctx.fillStyle="#eee";

  ctx.font=
  "700 27px -apple-system, sans-serif";

  ctx.fillText(
    "PHYSICAL RHYTHM PROFILE",
    W/2,
    42
  );


  ctx.fillStyle="#777";

  ctx.font=
  "14px -apple-system, sans-serif";

  ctx.fillText(
    "Tempo × Intensity × Rhythm × Sustain",
    W/2,
    66
  );


  if(
    selected.length===0
  ){

    ctx.fillStyle="#777";

    ctx.font=
    "20px -apple-system, sans-serif";

    ctx.fillText(
      "人物を選択してください",
      W/2,
      H/2
    );

    return;
  }


  const progress =
  clamp(
    elapsed/duration,
    0,
    1
  );


  const layout =
  getLayout(
    selected.length,
    W
  );


  const center =
  W/2;


  const span =
  layout.span;


  const slot =

  selected.length===1
  ?
  0
  :
  span/
  (
    selected.length-1
  );


  const trackWidth =
  layout.trackWidth;


  const trackHeight =
  layout.trackHeight;


  const trackBottom =
  555;


  selected.forEach(
    (profile,index)=>{


      const state =
      getState(
        profile,
        progress
      );


      let centerX;


      if(
        selected.length===1
      ){

        centerX =
        center;

      }

      else{

        centerX =

        center

        -

        span/2

        +

        slot*
        index;
      }


      /* NAME */

      ctx.fillStyle="#eee";

      ctx.font=
      selected.length<=2
      ?
      "700 24px -apple-system, sans-serif"
      :
      "700 19px -apple-system, sans-serif";

      ctx.textAlign="center";

      ctx.fillText(
        profile.name,
        centerX,
        115
      );


      ctx.fillStyle="#999";

      ctx.font=
      selected.length<=2
      ?
      "14px -apple-system, sans-serif"
      :
      "12px -apple-system, sans-serif";

      ctx.fillText(
        profile.type,
        centerX,
        138
      );


      ctx.fillStyle="#ddd";

      ctx.font=
      selected.length<=2
      ?
      "16px monospace"
      :
      "13px monospace";

      ctx.fillText(

        "T "+
        state.tempo.toFixed(1)+
        " / I "+
        state.intensity.toFixed(1),

        centerX,
        166
      );


      ctx.fillStyle="#777";

      ctx.font=
      "12px monospace";

      ctx.fillText(
        state.stage,
        centerX,
        187
      );


      /* TRACK */

      const x =
      centerX-
      trackWidth/2;


      const y =
      trackBottom-
      trackHeight;


      ctx.fillStyle="#29211e";

      roundRect(
        ctx,
        x,
        y,
        trackWidth,
        trackHeight,
        trackWidth/2
      );

      ctx.fill();


      ctx.strokeStyle="#4a3b35";

      ctx.lineWidth=2;

      ctx.stroke();


      /* CENTER GUIDE */

      ctx.strokeStyle=
      "rgba(255,255,255,.09)";

      ctx.lineWidth=1;

      ctx.beginPath();

      ctx.moveTo(
        x+10,
        y+
        trackHeight/2
      );

      ctx.lineTo(
        x+
        trackWidth-
        10,
        y+
        trackHeight/2
      );

      ctx.stroke();


      /* WAVE */

      const wave =
      motionWave(
        profile,
        phases[
          profile.id
        ]
      );


      const normalized =
      (
        wave+1
      )/2;


      const minimum =
      34;


      const extension =

      (
        28+
        state.intensity*
        29
      )

      *

      state.movementScale;


      let fillHeight =

      minimum

      +

      normalized*
      extension;


      fillHeight =
      Math.min(
        fillHeight,
        trackHeight-12
      );


      /*
        Last wind-down:
        settle near base.
      */

      if(
        state.movementScale===0
      ){

        fillHeight=
        minimum;
      }


      /* PEAK GLOW */

      const peakRatio =

      state.intensity/
      profile.peakI;


      if(
        peakRatio>.88 &&
        state.movementScale>.25
      ){

        ctx.shadowColor=
        "rgba(255,255,255,.48)";

        ctx.shadowBlur=
        17;
      }

      else{

        ctx.shadowBlur=0;
      }


      ctx.fillStyle="#eee8df";


      roundRect(

        ctx,

        x+7,

        trackBottom-
        7-
        fillHeight,

        trackWidth-14,

        fillHeight,

        (
          trackWidth-14
        )/2
      );


      ctx.fill();

      ctx.shadowBlur=0;


      /* RANGE */

      ctx.fillStyle="#777";

      ctx.font=
      selected.length<=2
      ?
      "12px monospace"
      :
      "10px monospace";


      ctx.fillText(

        "T"+
        profile.baseT+
        "–"+
        profile.peakT,

        centerX,
        580
      );


      ctx.fillText(

        "I"+
        profile.baseI+
        "–"+
        profile.peakI,

        centerX,
        598
      );

  });


  /* TIMELINE */

  const timing =
  getTiming();


  const lineY =
  646;


  const lineStart =
  90;


  const lineEnd =
  W-90;


  const xStart =
  lerp(
    lineStart,
    lineEnd,
    timing.activeStart
  );


  const xWind =
  lerp(
    lineStart,
    lineEnd,
    timing.windStart
  );


  /* Start */

  ctx.strokeStyle="#323232";

  ctx.lineWidth=7;

  ctx.beginPath();

  ctx.moveTo(
    lineStart,
    lineY
  );

  ctx.lineTo(
    xStart,
    lineY
  );

  ctx.stroke();


  /* Active */

  ctx.strokeStyle="#555";

  ctx.beginPath();

  ctx.moveTo(
    xStart,
    lineY
  );

  ctx.lineTo(
    xWind,
    lineY
  );

  ctx.stroke();


  /* Wind-down */

  ctx.strokeStyle="#303030";

  ctx.beginPath();

  ctx.moveTo(
    xWind,
    lineY
  );

  ctx.lineTo(
    lineEnd,
    lineY
  );

  ctx.stroke();


  const markerX =

  lerp(
    lineStart,
    lineEnd,
    progress
  );


  ctx.fillStyle="#eee8df";

  ctx.beginPath();

  ctx.arc(
    markerX,
    lineY,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#aaa";

  ctx.font=
  "13px monospace";

  ctx.textAlign="center";

  ctx.fillText(

    elapsed.toFixed(1)+
    " / "+
    duration+
    " sec",

    W/2,
    676
  );

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(
  timestamp
){

  if(!playing){
    return;
  }


  if(
    previousTimestamp===0
  ){

    previousTimestamp=
    timestamp;
  }


  const delta =

  (
    timestamp-
    previousTimestamp
  )/1000;


  previousTimestamp=
  timestamp;


  elapsed +=
  delta;


  if(
    elapsed>
    duration
  ){

    elapsed=
    duration;
  }


  const progress =

  clamp(
    elapsed/duration,
    0,
    1
  );


  profiles.forEach(
    profile=>{


      const state =
      getState(
        profile,
        progress
      );


      /*
        As wind-down approaches,
        actual animation also slows.
      */

      const frequency =

      (
        .24+
        state.tempo*.20
      )

      *

      Math.max(
        .08,
        state.movementScale
      );


      phases[
        profile.id
      ] +=

      Math.PI*
      2*
      frequency*
      delta;
  });


  timeline.value =
  Math.round(
    progress*1000
  );


  draw();


  if(
    elapsed>=
    duration
  ){

    playing=false;

    previousTimestamp=0;

    playButton.textContent=
    "Replay";


    if(
      recording
    ){

      stopRecording();
    }

    return;
  }


  animationID =
  requestAnimationFrame(
    animate
  );
}


/* =========================================================
   PLAY
========================================================= */

function startPlayback(){

  if(
    elapsed>=
    duration
  ){

    resetPlayback();
  }


  playing=true;

  previousTimestamp=0;

  playButton.textContent=
  "Pause";


  animationID =
  requestAnimationFrame(
    animate
  );
}


function pausePlayback(){

  playing=false;

  previousTimestamp=0;

  cancelAnimationFrame(
    animationID
  );

  playButton.textContent=
  "Play";
}


playButton.addEventListener(
  "click",
  ()=>{

    if(playing){
      pausePlayback();
    }

    else{
      startPlayback();
    }
  }
);


/* =========================================================
   RESET
========================================================= */

function resetPlayback(){

  playing=false;

  cancelAnimationFrame(
    animationID
  );

  elapsed=0;

  previousTimestamp=0;


  profiles.forEach(
    profile=>{

      phases[
        profile.id
      ]=0;
    }
  );


  timeline.value=0;

  playButton.textContent=
  "Play";

  draw();
}


resetButton.addEventListener(
  "click",
  resetPlayback
);


/* =========================================================
   SEEK
========================================================= */

timeline.addEventListener(
  "input",
  ()=>{

    const p =

    parseInt(
      timeline.value
    )/1000;


    elapsed =
    p*
    duration;


    profiles.forEach(
      profile=>{


        const state =
        getState(
          profile,
          p
        );


        const frequency =

        (
          .24+
          state.tempo*.20
        )

        *

        Math.max(
          .08,
          state.movementScale
        );


        phases[
          profile.id
        ] =

        elapsed*
        frequency*
        Math.PI*
        2;
    });


    draw();
  }
);


/* =========================================================
   DURATION
========================================================= */

durationInput.addEventListener(
  "change",
  ()=>{

    duration =
    clamp(
      parseFloat(
        durationInput.value
      ) || 60,
      20,
      300
    );


    durationInput.value=
    duration;


    elapsed =
    Math.min(
      elapsed,
      duration
    );


    draw();
  }
);


/* =========================================================
   SESSION
========================================================= */

function newSeed(){

  seedInput.value =
  Math.floor(
    10000+
    Math.random()*
    89999
  );

  resetPlayback();
}


newSessionButton.addEventListener(
  "click",
  newSeed
);


sessionMode.addEventListener(
  "change",
  ()=>{
    resetPlayback();
  }
);


seedInput.addEventListener(
  "change",
  ()=>{
    resetPlayback();
  }
);


/* =========================================================
   VIDEO RECORDING
========================================================= */

function getRecorderMimeType(){

  const candidates = [

    "video/webm;codecs=vp9",

    "video/webm;codecs=vp8",

    "video/webm"
  ];


  for(
    const type
    of candidates
  ){

    if(
      window.MediaRecorder &&
      MediaRecorder.isTypeSupported(
        type
      )
    ){

      return type;
    }
  }


  return "";
}


function startRecording(){

  if(
    !window.MediaRecorder ||
    !canvas.captureStream
  ){

    status.textContent =
    "このブラウザでは動画録画に対応していません。";

    return;
  }


  resetPlayback();


  const stream =
  canvas.captureStream(
    60
  );


  const mimeType =
  getRecorderMimeType();


  const options =
  mimeType
  ?
  {mimeType}
  :
  {};


  try{

    recorder =
    new MediaRecorder(
      stream,
      options
    );

  }

  catch(error){

    status.textContent =
    "録画を開始できませんでした。";

    return;
  }


  recordedChunks=[];


  recorder.ondataavailable =
  event=>{

    if(
      event.data &&
      event.data.size>0
    ){

      recordedChunks.push(
        event.data
      );
    }
  };


  recorder.onstop =
  ()=>{

    const blob =

    new Blob(
      recordedChunks,
      {
        type:
        recorder.mimeType ||
        "video/webm"
      }
    );


    const url =
    URL.createObjectURL(
      blob
    );


    const link =
    document.createElement(
      "a"
    );


    link.href=
    url;


    link.download=

    "physical-rhythm-v6-"+
    seedInput.value+
    ".webm";


    document.body.appendChild(
      link
    );


    link.click();

    link.remove();


    setTimeout(
      ()=>{
        URL.revokeObjectURL(
          url
        );
      },
      2000
    );


    recording=false;


    recordButton
    .classList
    .remove(
      "recording"
    );


    recordButton.textContent=
    "● Record";


    status.textContent=
    "録画完了";
  };


  recorder.start();


  recording=true;


  recordButton
  .classList
  .add(
    "recording"
  );


  recordButton.textContent=
  "■ Recording";


  status.textContent=
  "Recording…";


  startPlayback();
}


function stopRecording(){

  if(
    recorder &&
    recorder.state!=="inactive"
  ){

    recorder.stop();
  }


  recording=false;


  recordButton
  .classList
  .remove(
    "recording"
  );


  recordButton.textContent=
  "● Record";
}


recordButton.addEventListener(
  "click",
  ()=>{

    if(recording){
      stopRecording();
    }

    else{
      startRecording();
    }
  }
);


/* =========================================================
   INIT
========================================================= */

duration =
parseFloat(
  durationInput.value
);


profiles.forEach(
  profile=>{

    phases[
      profile.id
    ]=0;
  }
);


draw();

</script>
