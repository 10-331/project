<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physical Rhythm Profile Visualizer v2</title>

<style>
  :root {
    --bg: #000;
    --panel: #111;
    --track: #362a26;
    --fill: #ece5db;
    --muted: #aaa;
    --line: #2a2a2a;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: #fff;
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Helvetica,
      Arial,
      sans-serif;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 28px 16px;
  }

  .title {
    font-size: 15px;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
    font-weight: 700;
  }

  .subtitle {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 28px;
    text-align: center;
  }

  .visualizer-wrapper {
    display: grid;
    grid-template-columns: repeat(6, minmax(92px, 1fr));
    gap: 18px;
    align-items: end;
    width: min(980px, 100%);
  }

  .item {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
  }

  .name {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .type {
    font-size: 10px;
    color: #bfbfbf;
    text-align: center;
    height: 30px;
    line-height: 1.35;
    margin-bottom: 8px;
  }

  .readout {
    height: 34px;
    font-size: 10px;
    line-height: 1.45;
    text-align: center;
    color: #ddd;
    font-variant-numeric: tabular-nums;
    margin-bottom: 8px;
  }

  .capsule {
    width: 54px;
    height: 190px;
    background: var(--track);
    border-radius: 999px;
    position: relative;
    overflow: hidden;
    border: 1px solid #4a3b35;
  }

  .fill {
    position: absolute;
    bottom: 0;
    left: 0;

    width: 100%;
    height: 15%;

    background: var(--fill);
    border-radius: 999px;

    transition:
      height 0.12s linear,
      opacity 0.12s linear;
  }

  .pulse {
    position: absolute;

    left: 50%;
    transform: translateX(-50%);

    bottom: 8px;

    width: 8px;
    height: 8px;

    border-radius: 50%;
    background: #fff;

    opacity: 0;

    pointer-events: none;
  }

  .legend {
    width: min(980px, 100%);

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 12px;
    margin-top: 24px;
  }

  .legend-card {
    background: #0c0c0c;
    border: 1px solid var(--line);

    border-radius: 16px;

    padding: 12px 14px;

    font-size: 11px;
    line-height: 1.6;

    color: #ddd;
  }

  .legend-card b {
    color: #fff;
  }

  .controls {
    margin-top: 20px;

    display: flex;
    flex-wrap: wrap;

    gap: 12px;

    align-items: center;
    justify-content: center;

    background: var(--panel);

    padding: 14px 18px;

    border-radius: 28px;
    border: 1px solid #333;
  }

  button {
    padding: 8px 18px;

    border-radius: 20px;
    border: none;

    background: #ece5db;
    color: #000;

    font-weight: 700;
    cursor: pointer;
  }

  button.secondary {
    background: #222;
    color: #fff;
    border: 1px solid #444;
  }

  label {
    display: flex;
    align-items: center;

    gap: 8px;

    font-size: 11px;
    color: #ddd;
  }

  input[type="range"] {
    width: 130px;
    accent-color: #ece5db;
  }

  .time {
    min-width: 82px;

    text-align: center;

    font-size: 11px;
    color: #ddd;

    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 760px) {

    body {
      justify-content: flex-start;
    }

    .visualizer-wrapper {
      grid-template-columns: repeat(3, 1fr);
      row-gap: 28px;
    }

    .capsule {
      height: 150px;
    }

    .legend {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

<div class="title">
  PHYSICAL RHYTHM PROFILE v2
</div>

<div class="subtitle">
  高さ = Intensity ／ 脈動間隔 = Tempo ／ 波形 = Rhythm ／ 高い領域の滞在 = Sustain
</div>

<div
  class="visualizer-wrapper"
  id="visualizer">
</div>


<div class="legend">

  <div class="legend-card">
    <b>Tempo T1–T7</b><br>
    T1 = 非常にゆっくり ／
    T4 = 標準域 ／
    T7 = 比較上かなり速い。<br>
    ここでは脈動の間隔として表示。
  </div>

  <div class="legend-card">
    <b>Intensity I1–I10</b><br>
    I5 = 中程度。<br>
    カプセルの高さで表示。
    Peakは瞬間上限、
    Sustainは高い領域をどれだけ維持するか。
  </div>

</div>


<div class="controls">

  <button id="playBtn">
    Play
  </button>

  <button
    id="resetBtn"
    class="secondary">
    Reset
  </button>

  <label>
    再生速度

    <input
      id="speedSlider"
      type="range"
      min="0.5"
      max="3"
      step="0.25"
      value="1">

    <span id="speedValue">
      1.0×
    </span>
  </label>

  <div
    class="time"
    id="timeDisplay">
    0.0 / 60s
  </div>

</div>


<script>

const profiles = [

  {
    id: "naoto",
    name: "直人",
    type: "安定制御型",

    baseT: [3.2, 4.0],
    baseI: [4.2, 5.0],

    peakT: 5.0,
    peakI: 6.0,

    sustain: 0.48,

    rhythm: "steady",
    phase: 0.2
  },

  {
    id: "kei",
    name: "慧",
    type: "高強度持続型",

    baseT: [4.1, 5.0],
    baseI: [6.2, 7.0],

    peakT: 6.0,
    peakI: 9.0,

    sustain: 0.95,

    rhythm: "rampHold",
    phase: 0.8
  },

  {
    id: "shoma",
    name: "翔馬",
    type: "急加速ピーク型",

    baseT: [4.0, 5.0],
    baseI: [6.0, 7.0],

    peakT: 7.0,
    peakI: 8.0,

    sustain: 0.64,

    rhythm: "burst",
    phase: 1.6
  },

  {
    id: "minato",
    name: "湊",
    type: "反応追従型",

    baseT: [3.2, 4.1],
    baseI: [5.0, 6.0],

    peakT: 5.8,
    peakI: 7.0,

    sustain: 0.58,

    rhythm: "responsive",
    phase: 2.4
  },

  {
    id: "haruki",
    name: "晴輝",
    type: "コンディション変動型",

    baseT: [3.0, 4.1],
    baseI: [5.0, 6.0],

    peakT: 6.0,
    peakI: 8.0,

    sustain: 0.55,

    rhythm: "variable",
    phase: 3.0
  },

  {
    id: "hyunwoo",
    name: "ヒョヌ",
    type: "低中速・高密度制御型",

    baseT: [3.0, 4.0],
    baseI: [6.0, 7.0],

    peakT: 5.6,
    peakI: 8.0,

    sustain: 0.82,

    rhythm: "controlledWave",
    phase: 3.7
  }

];


const wrapper =
  document.getElementById("visualizer");


profiles.forEach(profile => {

  const element =
    document.createElement("div");

  element.className = "item";

  element.innerHTML = `

    <div class="name">
      ${profile.name}
    </div>

    <div class="type">
      ${profile.type}
    </div>

    <div
      class="readout"
      id="${profile.id}-readout">

      T -- / I --<br>
      巡航

    </div>

    <div class="capsule">

      <div
        class="fill"
        id="${profile.id}-fill">
      </div>

      <div
        class="pulse"
        id="${profile.id}-pulse">
      </div>

    </div>
  `;

  wrapper.appendChild(element);

});


let playing = false;

let startReal = 0;

let elapsedBeforePause = 0;

let animationFrame = 0;

let speed = 1;

const duration = 60;


const playBtn =
  document.getElementById("playBtn");

const resetBtn =
  document.getElementById("resetBtn");

const speedSlider =
  document.getElementById("speedSlider");

const speedValue =
  document.getElementById("speedValue");

const timeDisplay =
  document.getElementById("timeDisplay");


speedSlider.addEventListener(
  "input",
  () => {

    speed =
      parseFloat(speedSlider.value);

    speedValue.textContent =
      speed
        .toFixed(2)
        .replace(/0$/, "") + "×";

  }
);


function clamp(
  value,
  minimum,
  maximum
) {

  return Math.max(
    minimum,
    Math.min(maximum, value)
  );

}


function lerp(
  start,
  end,
  amount
) {

  return (
    start +
    (end - start) * amount
  );

}


function smoothstep(
  start,
  end,
  value
) {

  const t =
    clamp(
      (value - start) /
      (end - start),
      0,
      1
    );

  return (
    t *
    t *
    (3 - 2 * t)
  );

}


function profileState(
  profile,
  time
) {

  /*
    0〜10秒
      立ち上がり

    10〜34秒
      巡航 → 昂進

    34〜49秒
      Peak帯

    49〜60秒
      Cooldown
  */


  let stage;

  let tempo;

  let intensity;


  const warm =
    smoothstep(
      0,
      10,
      time
    );


  const rise =
    smoothstep(
      10,
      34,
      time
    );


  const peakWindow =

    smoothstep(
      34,
      40,
      time
    )

    *

    (
      1 -
      smoothstep(
        48,
        55,
        time
      )
    );


  const cooldown =
    smoothstep(
      48,
      60,
      time
    );


  const baseTempo =
    (
      profile.baseT[0] +
      profile.baseT[1]
    ) / 2;


  const baseIntensity =
    (
      profile.baseI[0] +
      profile.baseI[1]
    ) / 2;


  tempo =
    lerp(
      profile.baseT[0],
      baseTempo,
      warm
    );


  intensity =
    lerp(
      Math.max(
        2.5,
        profile.baseI[0] - 1
      ),

      baseIntensity,

      warm
    );


  /*
    直人
    安定制御型
  */

  if (
    profile.rhythm === "steady"
  ) {

    tempo +=
      0.28 *
      Math.sin(
        time * 0.55 +
        profile.phase
      );


    intensity +=
      0.30 *
      Math.sin(
        time * 0.42 +
        profile.phase
      );


    tempo +=
      rise * 0.55;


    intensity +=
      rise * 0.55;


    tempo +=
      peakWindow * 0.55;


    intensity +=
      peakWindow * 0.65;

  }


  /*
    慧
    徐々に上がる
    ↓
    高い領域を長く維持
  */

  if (
    profile.rhythm === "rampHold"
  ) {

    tempo +=
      rise * 0.75;


    intensity +=
      rise * 1.45;


    const hold =

      smoothstep(
        28,
        37,
        time
      )

      *

      (
        1 -
        smoothstep(
          52,
          60,
          time
        )
      );


    tempo +=
      hold * 0.55;


    intensity +=
      hold * 1.45;


    tempo +=
      0.15 *
      Math.sin(
        time * 0.7
      );


    intensity +=
      0.18 *
      Math.sin(
        time * 0.5
      );

  }


  /*
    翔馬
    急加速・ピーク型
  */

  if (
    profile.rhythm === "burst"
  ) {

    const burst =

      Math.max(
        0,

        Math.sin(
          (time - 9) * 0.58
        )
      );


    const secondBurst =

      Math.max(
        0,

        Math.sin(
          (time - 15) * 0.92
        )
      );


    tempo +=
      rise * 0.55 +
      burst * 1.15 +
      secondBurst * 0.45;


    intensity +=
      rise * 0.65 +
      burst * 0.75 +
      secondBurst * 0.35;


    if (
      time > 34 &&
      time < 46
    ) {

      tempo +=

        0.8 *

        Math.max(
          0,

          Math.sin(
            (time - 34) *
            1.25
          )
        );


      intensity +=

        0.45 *

        Math.max(
          0,

          Math.sin(
            (time - 34) *
            0.95
          )
        );

    }

  }


  /*
    湊
    反応追従・細かく変動
  */

  if (
    profile.rhythm === "responsive"
  ) {

    tempo +=

      0.45 *
      Math.sin(
        time * 0.52 +
        profile.phase
      )

      +

      0.22 *
      Math.sin(
        time * 1.15
      );


    intensity +=

      0.42 *
      Math.sin(
        time * 0.44 +
        profile.phase
      )

      +

      0.20 *
      Math.sin(
        time * 0.95
      );


    tempo +=
      rise * 0.5 +
      peakWindow * 0.55;


    intensity +=
      rise * 0.45 +
      peakWindow * 0.6;

  }


  /*
    晴輝
    コンディション変動型
  */

  if (
    profile.rhythm === "variable"
  ) {

    const mood =

      0.55 +

      0.45 *
      Math.sin(
        time * 0.18 +
        profile.phase
      );


    tempo +=

      0.35 *
      Math.sin(
        time * 0.56
      )

      +

      rise *
      (
        0.35 +
        0.45 * mood
      )

      +

      peakWindow *
      (
        0.35 +
        0.6 * mood
      );


    intensity +=

      0.38 *
      Math.sin(
        time * 0.46 +
        profile.phase
      )

      +

      rise *
      (
        0.4 +
        0.55 * mood
      )

      +

      peakWindow *
      (
        0.5 +
        0.7 * mood
      );

  }


  /*
    ヒョヌ
    低中速
    ＋
    強度高め
    ＋
    制御された緩急
  */

  if (
    profile.rhythm ===
    "controlledWave"
  ) {

    tempo +=

      0.32 *
      Math.sin(
        time * 0.34 +
        profile.phase
      )

      +

      rise * 0.45

      +

      peakWindow * 0.55;


    intensity +=

      0.35 *
      Math.sin(
        time * 0.31 +
        profile.phase
      )

      +

      rise * 0.8

      +

      peakWindow * 0.75;


    if (
      time > 38 &&
      time < 50
    ) {

      tempo -=

        0.25 *

        Math.sin(
          (time - 38) *
          0.38
        );


      intensity +=
        0.15;

    }

  }


  /*
    Cooldown

    Sustainが高い人物ほど
    Intensityが少し残りやすい。
  */

  if (
    cooldown > 0
  ) {

    const targetTempo =
      profile.baseT[0] *
      0.82;


    const targetIntensity =

      Math.max(

        2.5,

        profile.baseI[0] *
        (
          0.58 +
          profile.sustain * 0.10
        )

      );


    tempo =
      lerp(
        tempo,
        targetTempo,
        cooldown
      );


    intensity =
      lerp(
        intensity,
        targetIntensity,
        cooldown
      );

  }


  tempo =
    clamp(
      tempo,
      1,
      profile.peakT
    );


  intensity =
    clamp(
      intensity,
      1,
      profile.peakI
    );


  if (
    time < 10
  ) {

    stage =
      "立ち上がり";

  }

  else if (
    time < 34
  ) {

    stage =
      "巡航 → 昂進";

  }

  else if (
    time < 49
  ) {

    stage =
      "Peak帯";

  }

  else {

    stage =
      "Cooldown";

  }


  return {
    tempo,
    intensity,
    stage
  };

}


let lastPulseTimes = {};


function pulseFor(
  profile,
  simulationTime,
  tempo
) {

  /*
    Tempoを
    視覚上のBPMへ変換。

    T1 ≒ 42 BPM
    T4 ≒ 96 BPM
    T7 ≒ 150 BPM
  */

  const bpm =
    24 +
    tempo * 18;


  const interval =
    60 / bpm;


  const key =
    profile.id;


  if (
    lastPulseTimes[key] ===
    undefined
  ) {

    lastPulseTimes[key] =
      -999;

  }


  if (
    simulationTime -
    lastPulseTimes[key]
    >=
    interval
  ) {

    lastPulseTimes[key] =
      simulationTime;


    const pulse =
      document.getElementById(
        `${key}-pulse`
      );


    pulse.animate(

      [

        {
          opacity: 0,
          transform:
            "translateX(-50%) scale(0.7)"
        },

        {
          opacity: 0.9,
          transform:
            "translateX(-50%) scale(1.5)"
        },

        {
          opacity: 0,
          transform:
            "translateX(-50%) scale(0.7)"
        }

      ],

      {

        duration:
          Math.max(
            110,
            260 -
            10 * tempo
          ),

        easing:
          "ease-out"

      }

    );

  }

}


function render(
  simulationTime
) {

  profiles.forEach(
    profile => {

      const state =
        profileState(
          profile,
          simulationTime
        );


      const fill =
        document.getElementById(
          `${profile.id}-fill`
        );


      const readout =
        document.getElementById(
          `${profile.id}-readout`
        );


      /*
        I10 ≒ 95%
      */

      const height =
        8 +
        state.intensity *
        8.7;


      fill.style.height =
        `${height}%`;


      fill.style.opacity =
        `${
          0.72 +
          state.intensity *
          0.028
        }`;


      readout.innerHTML =

        `T ${state.tempo.toFixed(1)}
         / I ${state.intensity.toFixed(1)}
         <br>
         ${state.stage}`;


      pulseFor(
        profile,
        simulationTime,
        state.tempo
      );

    }
  );


  timeDisplay.textContent =

    `${simulationTime.toFixed(1)}
     / ${duration}s`;

}


function frame(
  now
) {

  if (
    !playing
  ) {

    return;

  }


  const elapsed =

    elapsedBeforePause

    +

    (
      (now - startReal) /
      1000
    )

    *

    speed;


  const simulationTime =
    Math.min(
      duration,
      elapsed
    );


  render(
    simulationTime
  );


  if (
    simulationTime >=
    duration
  ) {

    playing = false;

    elapsedBeforePause =
      duration;

    playBtn.textContent =
      "Replay";

    return;

  }


  animationFrame =
    requestAnimationFrame(
      frame
    );

}


playBtn.addEventListener(
  "click",
  () => {

    if (
      elapsedBeforePause >=
      duration
    ) {

      elapsedBeforePause =
        0;

      lastPulseTimes = {};

      render(0);

    }


    playing =
      !playing;


    if (
      playing
    ) {

      playBtn.textContent =
        "Pause";

      startReal =
        performance.now();


      animationFrame =
        requestAnimationFrame(
          frame
        );

    }

    else {

      playBtn.textContent =
        "Play";


      const now =
        performance.now();


      elapsedBeforePause +=

        (
          (now - startReal) /
          1000
        )

        *

        speed;


      cancelAnimationFrame(
        animationFrame
      );

    }

  }
);


resetBtn.addEventListener(
  "click",
  () => {

    playing = false;

    cancelAnimationFrame(
      animationFrame
    );


    elapsedBeforePause =
      0;


    lastPulseTimes = {};


    playBtn.textContent =
      "Play";


    render(0);

  }
);


render(0);

</script>

</body>
</html>
