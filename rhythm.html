<!DOCTYPE html>

<head>

<style>
* { box-sizing:border-box; }

@media(max-width:600px){
  body{padding-left:8px;padding-right:8px;}

</style>
</head>

<body>

<div class="app">

<h1>PHYSICAL RHYTHM PROFILE v5</h1>

<div class="subtitle">
Tempo × Intensity × Rhythm × Sustain × Session Variation
</div>


<div class="panel filters">

<button id="toggleAll" class="secondary">
全員
</button>

</label>

<label class="check">

</label>

<label class="check">
<input type="checkbox" class="personCheck" value="shoma" checked>
翔馬
</label>

<label class="check">
<input type="checkbox" class="personCheck" value="minato" checked>
湊
</label>

<label class="check">
<input type="checkbox" class="personCheck" value="haruki" checked>
晴輝
</label>

<label class="check">
<input type="checkbox" class="personCheck" value="hyunwoo" checked>
ヒョヌ

<div class="canvas-wrap">

<canvas
  id="canvas"
  width="1200"
  height="650">
</canvas>

</div>


<div class="panel timeline-panel">

<div class="timeline-labels">
<span>Warmup</span>
<span>Cruise</span>
<span>Rise</span>
<span>Peak</span>

<input

  type="range"

>

秒

Session

<option value="fixed">
Fixed
</option>

  value="natural"
  selected>
Natural
</option>

</select>
</label>

<input
  id="seed"
  type="number"

  class="status">

</div>


<div class="legend">

白いカプセル：

<br>

伸縮速度 = Tempo　
／　
伸縮幅 = Intensity　
／　
1往復の形 = Rhythm　
／　
高出力域の維持 = Sustain

<br>

Natural Sessionでは人物ごとの安定性を保ったまま、
その回固有の微細な揺らぎが入ります。

</div>

</div>



<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");



/* =========================================================
   PROFILE
========================================================= */

const profiles = [

{
 id:"naoto",
 name:"直人",
 type:"安定制御",
 baseT:3.7,
 peakT:5.0,
 baseI:4.7,
 peakI:6.0,
 variation:.16,
 rhythm:"steady"
},

{
 id:"kei",
 name:"慧",
 type:"高強度持続",
 baseT:4.6,
 peakT:6.0,
 baseI:6.7,
 peakI:9.0,
 variation:.20,
 rhythm:"hold"
},

{
 id:"shoma",
 name:"翔馬",
 type:"急加速ピーク",
 baseT:4.6,
 peakT:7.0,
 baseI:6.6,
 peakI:8.0,
 variation:.42,
 rhythm:"burst"
},

{
 id:"minato",
 name:"湊",
 type:"反応追従",
 baseT:3.8,
 peakT:5.8,
 baseI:5.5,
 peakI:7.0,
 variation:.34,
 rhythm:"responsive"
},

{
 id:"haruki",
 name:"晴輝",
 type:"状態変動",
 baseT:3.7,
 peakT:6.0,
 baseI:5.5,
 peakI:8.0,
 variation:.52,
 rhythm:"variable"
},

{
 id:"hyunwoo",
 name:"ヒョヌ",
 type:"高密度制御",
 baseT:3.6,
 peakT:5.6,
 baseI:6.6,
 peakI:8.0,
 variation:.18,
 rhythm:"controlled"
}

];



/* =========================================================
   DOM
========================================================= */

const playButton =
document.getElementById("play");

const resetButton =
document.getElementById("reset");

const recordButton =
document.getElementById("record");

const toggleAllButton =
document.getElementById("toggleAll");

const durationInput =
document.getElementById("duration");

const timeline =
document.getElementById("timeline");

const sessionMode =
document.getElementById("sessionMode");

const seedInput =
document.getElementById("seed");

const newSessionButton =
document.getElementById("newSession");

const status =
document.getElementById("status");

const checks =
Array.from(
 document.querySelectorAll(".personCheck")
);



/* =========================================================
   STATE
========================================================= */

let duration = 60;

let elapsed = 0;

let playing = false;

let previousTimestamp = 0;

let animationID = null;

let phases = {};

let recorder = null;

let recordedChunks = [];

let recording = false;

let autoRecording = false;



/* =========================================================
   HELPERS
========================================================= */

function clamp(v,a,b){

 return Math.max(
  a,
  Math.min(b,v)
 );

}


function lerp(a,b,t){

 return a+(b-a)*t;

}


function smooth(a,b,x){

 const t =
 clamp(
  (x-a)/(b-a),
  0,
  1
 );

 return t*t*(3-2*t);

}


function roundRect(
 context,
 x,
 y,
 width,
 height,
 radius
){

 const r =
 Math.min(
  radius,
  width/2,
  height/2
 );

 context.beginPath();

 context.roundRect(
  x,
  y,
  width,
  height,
  r
 );

}



/* =========================================================
   SEEDED RANDOM
========================================================= */

function hashString(str){

 let h =
 2166136261;

 for(
  let i=0;
  i<str.length;
  i++
 ){

  h ^=
  str.charCodeAt(i);

  h =
  Math.imul(
   h,
   16777619
  );

 }

 return h>>>0;

}


function seededRandom(
 seed,
 key
){

 let x =
 hashString(
  seed+"-"+key
 );

 x +=
 0x6D2B79F5;

 x =
 Math.imul(
  x^(x>>>15),
  x|1
 );

 x ^=
 x+
 Math.imul(
  x^(x>>>7),
  x|61
 );

 return (
  (
   x^(x>>>14)
  )>>>0
 ) / 4294967296;

}



/* =========================================================
   SESSION VARIATION
========================================================= */

function sessionNoise(
 profile,
 progress,
 channel
){

 if(
  sessionMode.value ===
  "fixed"
 ){

  return 0;

 }

 const seed =
 parseInt(seedInput.value)||1;


 const a =
 seededRandom(
  seed,
  profile.id+
  channel+
  "A"
 ) * Math.PI*2;


 const b =
 seededRandom(
  seed,
  profile.id+
  channel+
  "B"
 ) * Math.PI*2;


 const wave1 =
 Math.sin(
  progress*Math.PI*5+a
 );


 const wave2 =
 Math.sin(
  progress*Math.PI*11+b
 )*.35;


 return (
  wave1+
  wave2
 )
 *
 profile.variation;

}



/* =========================================================
   PROFILE STATE
========================================================= */

function getState(
 profile,
 progress
){

 const warm =
 smooth(
  0,
  .14,
  progress
 );


 const rise =
 smooth(
  .16,
  .54,
  progress
 );


 const peakWindow =

 smooth(
  .50,
  .64,
  progress
 )

 *

 (
  1-
  smooth(
   .80,
   .92,
   progress
  )
 );


 const cooldown =
 smooth(
  .80,
  1,
  progress
 );


 let tempo =
 lerp(
  Math.max(
   1,
   profile.baseT-.7
  ),
  profile.baseT,
  warm
 );


 let intensity =
 lerp(
  Math.max(
   1,
   profile.baseI-1
  ),
  profile.baseI,
  warm
 );



 /* NAOTO */

 if(
  profile.rhythm==="steady"
 ){

  tempo +=
  rise*.45+
  peakWindow*.4;

  intensity +=
  rise*.35+
  peakWindow*.55;

 }



 /* KEI */

 if(
  profile.rhythm==="hold"
 ){

  const hold =

  smooth(
   .40,
   .56,
   progress
  )

  *

  (
   1-
   smooth(
    .88,
    1,
    progress
   )
  );


  tempo +=
  rise*.65+
  hold*.55;


  intensity +=
  rise*1.1+
  hold*1.3;

 }



 /* SHOMA */

 if(
  profile.rhythm==="burst"
 ){

  const burst =

  Math.max(
   0,
   Math.sin(
    progress*
    Math.PI*
    9
   )
  );


  tempo +=
  rise*.45+
  burst*
  1.2*
  rise;


  intensity +=
  rise*.4+
  burst*
  .6*
  rise;


  if(
   progress>.52 &&
   progress<.8
  ){

   const secondBurst =

   Math.max(
    0,
    Math.sin(
     (
      progress-.52
     )
     *
     Math.PI*
     20
    )
   );


   tempo +=
   secondBurst*1.3;

   intensity +=
   secondBurst*.65;

  }

 }



 /* MINATO */

 if(
  profile.rhythm==="responsive"
 ){

  tempo +=
  rise*.35+
  peakWindow*.45;


  intensity +=
  rise*.3+
  peakWindow*.5;


  tempo +=
  Math.sin(
   progress*
   Math.PI*
   7
  )*.3;


  intensity +=
  Math.sin(
   progress*
   Math.PI*
   6
  )*.24;

 }



 /* HARUKI */

 if(
  profile.rhythm==="variable"
 ){

  const condition =

  .5+
  .5*
  Math.sin(
   progress*
   Math.PI*
   3+
   2
  );


  tempo +=
  rise*
  (
   .25+
   condition*.55
  );


  intensity +=
  rise*
  (
   .25+
   condition*.65
  );


  tempo +=
  peakWindow*
  (
   .3+
   condition*.55
  );


  intensity +=
  peakWindow*
  (
   .35+
   condition*.7
  );

 }



 /* HYUNWOO */

 if(
  profile.rhythm==="controlled"
 ){

  tempo +=
  rise*.35+
  peakWindow*.55;


  intensity +=
  rise*.65+
  peakWindow*.65;


  tempo +=
  Math.sin(
   progress*
   Math.PI*
   4
  )*.2;

 }



 /* SESSION VARIATION */

 tempo +=
 sessionNoise(
  profile,
  progress,
  "T"
 );


 intensity +=
 sessionNoise(
  profile,
  progress,
  "I"
 );



 /* COOLDOWN */

 if(
  cooldown>0
 ){

  tempo =
  lerp(
   tempo,
   Math.max(
    1,
    profile.baseT-.8
   ),
   cooldown
  );


  intensity =
  lerp(
   intensity,
   Math.max(
    2,
    profile.baseI*.65
   ),
   cooldown
  );

 }


 tempo =
 clamp(
  tempo,
  1,
  profile.peakT
 );


 intensity =
 clamp(
  intensity,
  1,
  profile.peakI
 );


 let stage;


 if(progress<.14)
  stage="WARMUP";

 else if(progress<.43)
  stage="CRUISE";

 else if(progress<.55)
  stage="RISE";

 else if(progress<.80)
  stage="PEAK";

 else
  stage="COOLDOWN";


 return {
  tempo,
  intensity,
  stage
 };

}



/* =========================================================
   MOTION SHAPE
========================================================= */

function motionWave(
 profile,
 phase
){

 const s =
 Math.sin(phase);


 if(
  profile.rhythm==="steady"
 ){

  return s;

 }


 if(
  profile.rhythm==="hold"
 ){

  return (
   Math.sign(s)*
   Math.pow(
    Math.abs(s),
    .82
   )
  );

 }


 if(
  profile.rhythm==="burst"
 ){

  return (
   Math.sign(s)*
   Math.pow(
    Math.abs(s),
    .52
   )
  );

 }


 if(
  profile.rhythm==="responsive"
 ){

  return clamp(

   s*.78+

   Math.sin(
    phase*1.7
   )*.22,

   -1,
   1

  );

 }


 if(
  profile.rhythm==="variable"
 ){

  return clamp(

   s*.82+

   Math.sin(
    phase*.47
   )*.18,

   -1,
   1

  );

 }


 if(
  profile.rhythm==="controlled"
 ){

  return Math.sin(

   phase+

   .28*
   Math.sin(
    phase*.5
   )

  );

 }


 return s;

}



/* =========================================================
   SELECTED PEOPLE
========================================================= */

function selectedProfiles(){

 return profiles.filter(
  profile => {

   const box =
   checks.find(
    c =>
    c.value===
    profile.id
   );

   return box &&
   box.checked;

  }
 );

}



/* =========================================================
   DRAW
========================================================= */

function draw(){

 const W =
 canvas.width;

 const H =
 canvas.height;


 ctx.fillStyle="#000";

 ctx.fillRect(
  0,
  0,
  W,
  H
 );


 const selected =
 selectedProfiles();


 /* TITLE */

 ctx.textAlign="center";

 ctx.fillStyle="#eee";

 ctx.font=
 "700 24px -apple-system, sans-serif";

 ctx.fillText(
  "PHYSICAL RHYTHM PROFILE",
  W/2,
  38
 );


 ctx.fillStyle="#777";

 ctx.font=
 "14px -apple-system, sans-serif";

 ctx.fillText(
  "Tempo × Intensity × Rhythm × Sustain",
  W/2,
  62
 );



 if(
  selected.length===0
 ){

  ctx.fillStyle="#777";

  ctx.font=
  "18px -apple-system, sans-serif";

  ctx.fillText(
   "人物を選択してください",
   W/2,
   H/2
  );

  return;

 }


 const progress =
 clamp(
  elapsed/duration,
  0,
  1
 );


 const marginX =
 45;


 const usableWidth =
 W-marginX*2;


 const slot =
 usableWidth/
 selected.length;


 const trackHeight =
 350;


 const trackWidth =
 Math.min(
  78,
  slot*.45
 );


 const trackBottom =
 510;


 selected.forEach(
  (profile,index)=>{


   const state =
   getState(
    profile,
    progress
   );


   const centerX =

   marginX+

   slot*
   (
    index+.5
   );


   /* NAME */

   ctx.fillStyle="#eee";

   ctx.font=
   "700 18px -apple-system, sans-serif";

   ctx.textAlign="center";

   ctx.fillText(
    profile.name,
    centerX,
    102
   );


   ctx.fillStyle="#888";

   ctx.font=
   "12px -apple-system, sans-serif";

   ctx.fillText(
    profile.type,
    centerX,
    122
   );


   /* VALUES */

   ctx.fillStyle="#ddd";

   ctx.font=
   "13px monospace";

   ctx.fillText(

    "T "+
    state.tempo.toFixed(1)+
    " / I "+
    state.intensity.toFixed(1),

    centerX,
    148

   );


   ctx.fillStyle="#777";

   ctx.font=
   "11px monospace";

   ctx.fillText(
    state.stage,
    centerX,
    166
   );



   /* TRACK */

   const x =
   centerX-
   trackWidth/2;


   const y =
   trackBottom-
   trackHeight;


   ctx.fillStyle="#29211e";

   roundRect(
    ctx,
    x,
    y,
    trackWidth,
    trackHeight,
    trackWidth/2
   );

   ctx.fill();


   ctx.strokeStyle="#4a3b35";

   ctx.lineWidth=2;

   ctx.stroke();



   /* CENTER GUIDE */

   ctx.strokeStyle=
   "rgba(255,255,255,.10)";

   ctx.lineWidth=1;

   ctx.beginPath();

   ctx.moveTo(
    x+9,
    y+
    trackHeight/2
   );

   ctx.lineTo(
    x+
    trackWidth-
    9,
    y+
    trackHeight/2
   );

   ctx.stroke();



   /* WAVE */

   const wave =
   motionWave(
    profile,
    phases[
     profile.id
    ]
   );


   const normalized =
   (
    wave+1
   )/2;



   /*
     Intensity determines
     extension range.
   */

   const minimum =
   34;


   const extension =

   25+

   state.intensity*
   25;


   let fillHeight =

   minimum+

   normalized*
   extension;


   fillHeight =
   Math.min(
    fillHeight,
    trackHeight-12
   );



   /* PEAK GLOW */

   const ownPeakRatio =

   state.intensity/
   profile.peakI;


   if(
    ownPeakRatio>.88
   ){

    ctx.shadowColor=
    "rgba(255,255,255,.55)";

    ctx.shadowBlur=
    18;

   }

   else{

    ctx.shadowBlur=0;

   }



   /* FILL */

   ctx.fillStyle="#eee8df";


   roundRect(

    ctx,

    x+7,

    trackBottom-
    7-
    fillHeight,

    trackWidth-14,

    fillHeight,

    (
     trackWidth-14
    )/2

   );


   ctx.fill();


   ctx.shadowBlur=0;



   /* RANGE MARKERS */

   ctx.fillStyle="#777";

   ctx.font=
   "10px monospace";


   ctx.fillText(

    "T"+
    profile.baseT+
    "–"+
    profile.peakT,

    centerX,
    535

   );


   ctx.fillText(

    "I"+
    profile.baseI+
    "–"+
    profile.peakI,

    centerX,
    551

   );

 });


 /* TIMELINE */

 const lineY =
 594;


 const lineStart =
 80;


 const lineEnd =
 W-80;


 const sections = [

  [0,.14,"#333"],

  [.14,.43,"#3a3a3a"],

  [.43,.55,"#454545"],

  [.55,.80,"#555"],

  [.80,1,"#333"]

 ];


 sections.forEach(
  section=>{

   const x1 =
   lerp(
    lineStart,
    lineEnd,
    section[0]
   );


   const x2 =
   lerp(
    lineStart,
    lineEnd,
    section[1]
   );


   ctx.strokeStyle=
   section[2];

   ctx.lineWidth=6;

   ctx.beginPath();

   ctx.moveTo(
    x1,
    lineY
   );

   ctx.lineTo(
    x2,
    lineY
   );

   ctx.stroke();

  }
 );


 const markerX =

 lerp(
  lineStart,
  lineEnd,
  progress
 );


 ctx.fillStyle="#eee8df";

 ctx.beginPath();

 ctx.arc(
  markerX,
  lineY,
  7,
  0,
  Math.PI*2
 );

 ctx.fill();


 ctx.fillStyle="#aaa";

 ctx.font=
 "12px monospace";

 ctx.textAlign="center";

 ctx.fillText(

  elapsed.toFixed(1)+
  " / "+
  duration+
  " sec",

  W/2,
  626

 );

}



/* =========================================================
   ANIMATION
========================================================= */

function animate(timestamp){

 if(!playing)
  return;


 if(
  previousTimestamp===0
 ){

  previousTimestamp=
  timestamp;

 }


 const delta =

 (
  timestamp-
  previousTimestamp
 )/1000;


 previousTimestamp=
 timestamp;


 elapsed +=
 delta;


 if(
  elapsed>
  duration
 ){

  elapsed=
  duration;

 }


 const progress =

 clamp(
  elapsed/duration,
  0,
  1
 );


 profiles.forEach(
  profile=>{


   const state =
   getState(
    profile,
    progress
   );


   /*
     Visual frequency.
   */

   const frequency =

   .25+

   state.tempo*
   .20;


   phases[
    profile.id
   ] +=

   Math.PI*
   2*
   frequency*
   delta;

  }
 );


 timeline.value =
 Math.round(
  progress*1000
 );


 draw();


 if(
  elapsed>=duration
 ){

  playing=false;

  previousTimestamp=0;

  playButton.textContent=
  "Replay";


  if(
   recording
  ){

   stopRecording();

  }


  return;

 }


 animationID =
 requestAnimationFrame(
  animate
 );

}



/* =========================================================
   PLAY
========================================================= */

function startPlayback(){

 if(
  elapsed>=duration
 ){

  resetPlayback();

 }


 playing=true;

 previousTimestamp=0;

 playButton.textContent=
 "Pause";


 animationID =
 requestAnimationFrame(
  animate
 );

}


function pausePlayback(){

 playing=false;

 previousTimestamp=0;

 cancelAnimationFrame(
  animationID
 );

 playButton.textContent=
 "Play";

}


playButton.addEventListener(
 "click",
 ()=>{

  if(playing)
   pausePlayback();

  else
   startPlayback();

 }
);



/* =========================================================
   RESET
========================================================= */

function resetPlayback(){

 playing=false;

 cancelAnimationFrame(
  animationID
 );

 elapsed=0;

 previousTimestamp=0;


 profiles.forEach(
  p=>{
   phases[p.id]=0;
  }
 );


 timeline.value=0;

 playButton.textContent=
 "Play";

 draw();

}


resetButton.addEventListener(
 "click",
 resetPlayback
);



/* =========================================================
   TIMELINE SEEK
========================================================= */

timeline.addEventListener(
 "input",
 ()=>{

  const p =
  parseInt(
   timeline.value
  )/1000;


  elapsed =
  p*
  duration;


  /*
    Reconstruct approximate phase
    so seek works predictably.
  */

  profiles.forEach(
   profile=>{

    const state =
    getState(
     profile,
     p
    );


    const frequency =

    .25+

    state.tempo*.20;


    phases[
     profile.id
    ] =

    elapsed*
    frequency*
    Math.PI*
    2;

   }
  );


  draw();

 }
);



/* =========================================================
   DURATION
========================================================= */

durationInput.addEventListener(
 "change",
 ()=>{

  duration =
  clamp(
   parseFloat(
    durationInput.value
   )||60,
   15,
   300
  );


  durationInput.value=
  duration;


  elapsed =
  Math.min(
   elapsed,
   duration
  );


  draw();

 }
);



/* =========================================================
   CHECKBOXES
========================================================= */

checks.forEach(
 box=>{

  box.addEventListener(
   "change",
   draw
  );

 }
);


toggleAllButton.addEventListener(
 "click",
 ()=>{

  const allChecked =
  checks.every(
   c=>c.checked
  );


  checks.forEach(
   c=>{
    c.checked=
    !allChecked;
   }
  );


  draw();

 }
);



/* =========================================================
   SESSION
========================================================= */

function newSeed(){

 seedInput.value =
 Math.floor(
  10000+
  Math.random()*
  89999
 );

 resetPlayback();

}


newSessionButton.addEventListener(
 "click",
 newSeed
);


sessionMode.addEventListener(
 "change",
 ()=>{
  resetPlayback();
 }
);


seedInput.addEventListener(
 "change",
 ()=>{
  resetPlayback();
 }
);



/* =========================================================
   VIDEO RECORDING
========================================================= */

function getRecorderMimeType(){

 const candidates = [

  "video/webm;codecs=vp9",

  "video/webm;codecs=vp8",

  "video/webm"

 ];


 for(
  const type
  of candidates
 ){

  if(
   MediaRecorder
   .isTypeSupported(type)
  ){

   return type;

  }

 }


 return "";

}



function startRecording(){

 if(
  !window.MediaRecorder ||
  !canvas.captureStream
 ){

  status.textContent =
  "このブラウザでは動画録画に対応していません。";

  return;

 }


 resetPlayback();


 const stream =
 canvas.captureStream(60);


 const mimeType =
 getRecorderMimeType();


 const options =
 mimeType
 ?
 {mimeType}
 :
 {};


 try{

  recorder =
  new MediaRecorder(
   stream,
   options
  );

 }

 catch(error){

  status.textContent =
  "録画を開始できませんでした。";

  return;

 }


 recordedChunks=[];


 recorder.ondataavailable =
 event=>{

  if(
   event.data &&
   event.data.size>0
  ){

   recordedChunks.push(
    event.data
   );

  }

 };


 recorder.onstop =
 ()=>{


  const blob =

  new Blob(

   recordedChunks,

   {
    type:
    recorder.mimeType ||
    "video/webm"
   }

  );


  const url =
  URL.createObjectURL(
   blob
  );


  const link =
  document.createElement(
   "a"
  );


  const seed =
  seedInput.value;


  link.href=
  url;


  link.download=

  "physical-rhythm-"+
  seed+
  ".webm";


  document.body.appendChild(
   link
  );


  link.click();


  link.remove();


  setTimeout(
   ()=>{
    URL.revokeObjectURL(
     url
    );
   },
   2000
  );


  recording=false;

  autoRecording=false;


  recordButton.classList.remove(
   "recording"
  );


  recordButton.textContent=
  "● Record";


  status.textContent=
  "録画完了";

 };


 recorder.start();


 recording=true;

 autoRecording=true;


 recordButton.classList.add(
  "recording"
 );


 recordButton.textContent=
 "■ Recording";


 status.textContent=
 "Recording…";


 startPlayback();

}



function stopRecording(){

 if(
  recorder &&
  recorder.state!=="inactive"
 ){

  recorder.stop();

 }


 recording=false;

 autoRecording=false;


 recordButton.classList.remove(
  "recording"
 );


 recordButton.textContent=
 "● Record";

}



recordButton.addEventListener(
 "click",
 ()=>{

  if(recording){

   stopRecording();

  }

  else{

   startRecording();

  }

 }
);



/* =========================================================
   INIT
========================================================= */

duration =
parseFloat(
 durationInput.value
);


profiles.forEach(
 profile=>{

  phases[
   profile.id
  ]=0;

 }
);


draw();

</script>

</body>
</html>
