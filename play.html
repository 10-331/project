<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dyad Interaction Simulator v3</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#050505;
  --panel:#101010;
  --line:#292929;
  --soft:#181818;
  --text:#eee;
  --muted:#8e8e8e;
  --cream:#eee8df;
  --danger:#b99b9b;
}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{padding-bottom:104px}
button,select{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.app{width:min(760px,100%);margin:auto;padding:10px 8px 44px}

.top{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(5,5,5,.94);
  backdrop-filter:blur(14px);
  padding:7px 0 9px;
}
.top-row{display:flex;gap:7px;align-items:center}
.partner-select{
  flex:1;
  min-width:0;
  background:#151515;
  color:#eee;
  border:1px solid #333;
  border-radius:14px;
  padding:9px 10px;
  font-weight:700;
}
.icon-btn{
  border:1px solid #333;
  background:#171717;
  color:#ddd;
  border-radius:14px;
  padding:9px 11px;
  white-space:nowrap;
}
.icon-btn.active{
  background:var(--cream);
  color:#111;
  border-color:var(--cream);
}
.mode-row{display:flex;gap:6px;margin-top:7px}
.mode-btn{
  flex:1;
  border:1px solid #333;
  background:#171717;
  color:#aaa;
  border-radius:13px;
  padding:7px;
  font-size:12px;
}
.mode-btn.active{
  background:var(--cream);
  color:#111;
  border-color:var(--cream);
  font-weight:700;
}

.stage{
  position:relative;
  min-height:590px;
  border:1px solid #242424;
  border-radius:24px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 35%,#171717 0,#090909 48%,#050505 78%);
}
.partner{
  position:absolute;
  top:28px;
  left:50%;
  width:100%;
  transform:translateX(-50%);
  text-align:center;
}
.partner-name{font-size:23px;font-weight:750}
.partner-status{
  min-height:20px;
  color:#8e8e8e;
  font-size:12px;
  margin-top:4px;
}
.distance-line{
  margin-top:5px;
  color:#676767;
  font-size:10px;
}

.capsule-zone{
  position:relative;
  width:118px;
  height:228px;
  margin:10px auto 0;
}
.inner-shell{
  position:absolute;
  left:50%;
  bottom:5px;
  width:84px;
  height:80px;
  transform:translateX(-50%);
  border-radius:48px;
  border:2px solid rgba(238,232,223,0);
  background:rgba(238,232,223,0);
  filter:drop-shadow(0 0 0 rgba(255,255,255,0));
  transition:border-color .3s,background .3s,filter .3s;
}
.stage.backstage-on .inner-shell{
  border-color:rgba(238,232,223,.23);
  background:rgba(238,232,223,.025);
  filter:drop-shadow(0 0 8px rgba(255,255,255,.12));
}
.track{
  position:absolute;
  left:50%;
  bottom:5px;
  width:64px;
  height:216px;
  transform:translateX(-50%);
  border-radius:38px;
  background:#211c1a;
  border:1px solid #493d38;
  overflow:hidden;
}
.fill{
  position:absolute;
  left:7px;
  right:7px;
  bottom:7px;
  height:58px;
  border-radius:30px;
  background:var(--cream);
  will-change:height,transform;
  box-shadow:0 0 0 rgba(255,255,255,0);
}
.fill.hot{
  box-shadow:0 0 15px rgba(255,255,255,.28);
}

.speech{
  position:absolute;
  top:312px;
  left:50%;
  width:min(88%,430px);
  transform:translateX(-50%);
  text-align:center;
  pointer-events:none;
}
.speech-bubble{
  display:inline-block;
  min-height:30px;
  max-width:100%;
  padding:9px 14px;
  border-radius:17px;
  background:rgba(238,232,223,.95);
  color:#111;
  font-size:14px;
  line-height:1.55;
  opacity:0;
  transform:translateY(5px);
  transition:.25s;
}
.speech-bubble.show{
  opacity:1;
  transform:translateY(0);
}

.signal-lane{
  position:absolute;
  top:372px;
  bottom:155px;
  left:50%;
  width:160px;
  transform:translateX(-50%);
  pointer-events:none;
}
.signal{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  font-size:12px;
  padding:6px 10px;
  border:1px solid rgba(238,232,223,.45);
  border-radius:14px;
  background:rgba(8,8,8,.88);
  color:#ddd;
  white-space:nowrap;
  opacity:0;
}
.signal.fly{animation:signalFly 1.15s ease-out forwards}
.signal.missed{animation:signalMiss 1.15s ease-out forwards}

@keyframes signalFly{
  0%{bottom:0;opacity:0;transform:translateX(-50%) scale(.9)}
  12%{opacity:1}
  80%{opacity:1}
  100%{bottom:118px;opacity:0;transform:translateX(-50%) scale(1.03)}
}
@keyframes signalMiss{
  0%{bottom:0;opacity:0}
  15%{opacity:1}
  65%{opacity:.55}
  100%{
    bottom:70px;
    opacity:0;
    transform:translateX(-50%) translateX(30px)
  }
}

.ayane{
  position:absolute;
  bottom:36px;
  left:50%;
  width:92%;
  transform:translateX(-50%);
  text-align:center;
}
.ayane-name{font-size:18px;font-weight:700}
.ayane-visible{
  min-height:44px;
  margin-top:8px;
  color:#ddd;
  font-size:14px;
  line-height:1.55;
}
.ayane-sub{
  min-height:18px;
  color:#777;
  font-size:11px;
  margin-top:3px;
}
.active-states{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:5px;
  margin-top:9px;
  min-height:27px;
}
.state-pill{
  border-radius:14px;
  padding:5px 9px;
  background:#242424;
  color:#d8d8d8;
  font-size:11px;
}

.event-strip{
  margin-top:8px;
  min-height:54px;
  padding:10px 12px;
  border:1px solid #242424;
  border-radius:17px;
  background:#0e0e0e;
}
.event-time{font-size:10px;color:#666}
.event-text{margin-top:3px;font-size:13px;line-height:1.5}

.partner-prompt{
  display:none;
  margin-top:8px;
  border:1px solid #3a3632;
  border-radius:18px;
  background:#151310;
  padding:12px;
}
.partner-prompt.show{display:block}
.prompt-kicker{font-size:10px;color:#8d8176}
.prompt-text{font-size:14px;line-height:1.55;margin-top:4px}
.prompt-wait{font-size:10px;color:#6e6a66;margin-top:6px}
.prompt-buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
  margin-top:10px;
}
.prompt-btn{
  border:1px solid #3b3936;
  background:#1d1a18;
  color:#eee;
  border-radius:14px;
  padding:10px 7px;
  min-height:44px;
}

.bottom-nav{
  position:fixed;
  z-index:60;
  left:0;
  right:0;
  bottom:0;
  padding:
    8px
    max(8px,env(safe-area-inset-right))
    calc(8px + env(safe-area-inset-bottom))
    max(8px,env(safe-area-inset-left));
  background:rgba(8,8,8,.96);
  border-top:1px solid #292929;
  backdrop-filter:blur(16px);
}
.bottom-inner{
  width:min(760px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}
.tab{
  border:1px solid #333;
  border-radius:15px;
  background:#171717;
  color:#ccc;
  padding:10px 4px;
  font-weight:700;
}
.tab.active{
  background:var(--cream);
  color:#111;
  border-color:var(--cream);
}

.sheet{
  position:fixed;
  z-index:55;
  left:0;
  right:0;
  bottom:0;
  transform:translateY(110%);
  transition:transform .26s cubic-bezier(.25,.8,.25,1);
  padding:
    12px
    max(10px,env(safe-area-inset-right))
    calc(82px + env(safe-area-inset-bottom))
    max(10px,env(safe-area-inset-left));
  background:rgba(15,15,15,.98);
  border-top:1px solid #353535;
  border-radius:22px 22px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.5);
}
.sheet.open{transform:translateY(0)}
.sheet-inner{width:min(760px,100%);margin:auto}
.sheet-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
  font-size:13px;
  font-weight:700;
}
.close-sheet{
  border:none;
  background:none;
  color:#888;
  font-size:20px;
}
.button-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}
.action-button{
  min-height:48px;
  border:1px solid #363636;
  border-radius:15px;
  background:#1c1c1c;
  color:#eee;
  padding:9px;
}
.action-button:active{transform:scale(.97)}
.action-button.state-active{
  background:var(--cream);
  color:#111;
  border-color:var(--cream);
  font-weight:700;
}

.drawer-mask{
  position:fixed;
  inset:0;
  z-index:79;
  background:rgba(0,0,0,.52);
  opacity:0;
  pointer-events:none;
  transition:.22s;
}
.drawer-mask.show{
  opacity:1;
  pointer-events:auto;
}
.drawer{
  position:fixed;
  z-index:80;
  top:0;
  right:0;
  bottom:0;
  width:min(88vw,390px);
  transform:translateX(105%);
  transition:transform .26s ease;
  background:#101010;
  border-left:1px solid #333;
  padding:
    calc(15px + env(safe-area-inset-top))
    14px
    calc(20px + env(safe-area-inset-bottom));
  overflow:auto;
}
.drawer.show{transform:translateX(0)}
.drawer-head{
  position:sticky;
  top:0;
  background:#101010;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:12px;
  border-bottom:1px solid #292929;
}
.drawer-title{font-weight:750}
.log-entry{
  padding:14px 1px;
  border-bottom:1px solid #292929;
}
.log-meta{
  color:#777;
  font-size:10px;
  margin-bottom:5px;
}
.log-body{
  color:#ddd;
  font-size:13px;
  line-height:1.75;
  white-space:pre-line;
}

.auto-banner{
  display:none;
  margin-top:8px;
  padding:9px 12px;
  border-radius:14px;
  background:#171717;
  color:#aaa;
  font-size:11px;
  text-align:center;
}
.auto-banner.show{display:block}

@media(max-width:390px){
  .stage{min-height:570px}
  .capsule-zone{height:214px}
  .track{height:202px}
  .speech{top:296px}
  .signal-lane{top:356px}
}
</style>
</head>

<body>

<div class="app">

  <div class="top">

    <div class="top-row">

      <select id="partnerSelect" class="partner-select">
        <option value="naoto">桐谷直人</option>
        <option value="kei" selected>黒川慧</option>
        <option value="shoma">朝倉翔馬</option>
        <option value="minato">三浦湊</option>
        <option value="haruki">宮田晴輝</option>
        <option value="hyunwoo">チェ・ヒョヌ</option>
      </select>

      <button id="backstageBtn" class="icon-btn">
        彼ログ
      </button>

      <button id="dialogueBtn" class="icon-btn active">
        台詞
      </button>

    </div>

    <div class="mode-row">

      <button id="manualBtn" class="mode-btn active">
        操作する
      </button>

      <button id="autoBtn" class="mode-btn">
        AUTOに任せる
      </button>

      <button id="resetBtn" class="mode-btn">
        Reset
      </button>

    </div>

  </div>


  <div id="stage" class="stage">

    <div class="partner">

      <div id="partnerName" class="partner-name">
        慧
      </div>

      <div id="partnerStatus" class="partner-status">
        彩音の様子を見ている
      </div>

      <div id="distanceLine" class="distance-line">
        距離：近い
      </div>

      <div class="capsule-zone">

        <div id="innerShell" class="inner-shell"></div>

        <div class="track">
          <div id="fill" class="fill"></div>
        </div>

      </div>

    </div>


    <div class="speech">
      <div id="speechBubble" class="speech-bubble"></div>
    </div>


    <div id="signalLane" class="signal-lane"></div>


    <div class="ayane">

      <div class="ayane-name">
        彩音
      </div>

      <div id="ayaneVisible" class="ayane-visible">
        大きな変化はまだ表に出ていない
      </div>

      <div id="ayaneSub" class="ayane-sub">
        操作は下のタブから
      </div>

      <div id="activeStates" class="active-states"></div>

    </div>

  </div>


  <div id="autoBanner" class="auto-banner">
    AUTO中。今の状態を維持したまま「操作する」に戻せます。
  </div>


  <div id="partnerPrompt" class="partner-prompt">

    <div class="prompt-kicker">
      彼からのACTION
    </div>

    <div id="promptText" class="prompt-text"></div>

    <div id="promptWait" class="prompt-wait"></div>

    <div id="promptButtons" class="prompt-buttons"></div>

  </div>


  <div class="event-strip">

    <div id="eventTime" class="event-time">
      00:00
    </div>

    <div id="eventText" class="event-text">
      Session start
    </div>

  </div>

</div>


<div id="sheet" class="sheet">

  <div class="sheet-inner">

    <div class="sheet-title">

      <span id="sheetTitle">
        気持ち
      </span>

      <button id="closeSheet" class="close-sheet">
        ×
      </button>

    </div>

    <div id="sheetButtons" class="button-grid"></div>

  </div>

</div>


<div class="bottom-nav">

  <div class="bottom-inner">

    <button class="tab" data-tab="feel">
      ♡ 気持ち
    </button>

    <button class="tab" data-tab="state">
      ● STATE
    </button>

    <button class="tab" data-tab="action">
      → ACTION
    </button>

  </div>

</div>


<div id="drawerMask" class="drawer-mask"></div>

<div id="drawer" class="drawer">

  <div class="drawer-head">

    <div>

      <div class="drawer-title">
        彼ログ
      </div>

      <div style="font-size:10px;color:#777;margin-top:3px">
        BACKSTAGE
      </div>

    </div>

    <button id="closeDrawer" class="icon-btn">
      閉じる
    </button>

  </div>

  <div id="backstageLog"></div>

</div>

========================================================= */

/* =========================================================
   HELPERS
========================================================= */

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}


function lerp(a,b,t){
  return a+(b-a)*t;
}


function chance(p){
  return Math.random()<p;
}


function rand(a,b){
  return a+Math.random()*(b-a);
}


function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}


function sec(){
  return(
    performance.now()-
    sessionStart
  )/1000;
}


function timeString(){

  const t=
    Math.floor(sec());

  return(
    `${String(Math.floor(t/60)).padStart(2,"0")}:`+
    `${String(t%60).padStart(2,"0")}`
  );

}

  eventText.textContent=

/* =========================================================
   MEMORY
========================================================= */

function remember(type,data={}){

  memory.push({
    time:sec(),
    type,
    ...data
  });

  if(memory.length>80){
    memory.shift();
  }

}


function recent(type,within=14){

  const n=sec();

  return memory
    .slice()
    .reverse()
    .find(
      x=>
      x.type===type &&
      n-x.time<=within
    );

}


function recentAny(types,within=14){

  const n=sec();

  return memory
    .slice()
    .reverse()
    .find(
      x=>
      types.includes(x.type) &&
      n-x.time<=within
    );

}


function recentNoticedPositive(within=18){

  const n=sec();

  return memory
    .slice()
    .reverse()
    .find(
      x=>
      x.type==="noticed" &&
      x.positive &&
      n-x.time<=within
    );

}

/* =========================================================
   PERCEPTION
========================================================= */

function processCues(cues,source){

  const p=
    profiles[partnerId];


  if(!cues.length){

    ayaneVisible.textContent=
      "大きな変化は表に出なかった";

    ayaneSub.textContent=
      "彼に新しい情報は届いていない";

    return;

  }


  const strongest=
    [...cues].sort(
      (a,b)=>b.power-a.power
    )[0];


  ayaneVisible.textContent=
    strongest.text;


  ayaneSub.textContent=
    cues.length>1
    ? cues
        .filter(x=>x!==strongest)
        .map(x=>x.text)
        .join("・")
    : "彼が気づくかはまだ分からない";


  const noticed=[];


  cues.forEach(c=>{

    const base=
      p.notice[c.channel] ??
      .65;


    const prob=
      clamp(
        base *
        (
          .56+
          c.power*.52
        ),
        .05,
        .995
      );


    if(chance(prob)){
      noticed.push(c);
    }

  });


  cues.forEach(c=>{

    signal(

      c.channel==="face"
      ? "表情"

      : c.channel==="gaze"
      ? "視線"

      : c.channel==="voice"
      ? "声"

      : c.channel==="distance"
      ? "距離"

      : "行動",

      noticed.includes(c)

    );

  });


  setTimeout(
    ()=>{
      interpret(
        source,
        cues,
        noticed
      );
    },
    rand(
      p.noticeDelay[0],
      p.noticeDelay[1]
    )
  );

}


/* =========================================================
   INTERPRETATION
========================================================= */

function interpret(source,cues,noticed){

  const p=
    profiles[partnerId];


  if(!noticed.length){

    if(chance(.55)){
      addBackstage(
        missedText(partnerId)
      );
    }

    return;

  }


  const strength=
    noticed.reduce(
      (s,x)=>s+x.power,
      0
    )/
    noticed.length;


  mind.attention=
    clamp(
      mind.attention+
      strength*.20,
      0,
      1
    );


  const it=
    interpretMeaning(
      source,
      noticed,
      strength
    );


  mind.desire=
    clamp(
      mind.desire+
      it.desire*
      p.desireGain,
      0,
      1
    );


  mind.pursuit=
    clamp(
      mind.pursuit+
      it.pursuit,
      0,
      1
    );


  mind.cuteAgg=
    clamp(
      mind.cuteAgg+
      (it.cute||0)*
      p.cute,
      0,
      1
    );


  mind.uncertainty=
    clamp(
      mind.uncertainty+
      (it.uncertainty||0),
      0,
      1
    );


  remember(
    "noticed",
    {
      source,
      meaning:it.meaning,
      positive:
        noticed.some(
          x=>x.positive
        ),
      channels:
        noticed.map(
          x=>x.channel
        ),
      qualities:
        noticed
        .map(x=>x.quality)
        .filter(Boolean)
    }
  );


  addBackstage(
    it.inner
  );


  if(it.status){

    partnerStatus.textContent=
      it.status;

  }


  if(it.public){

    showEvent(
      it.public
    );

  }


  if(it.dialogue){

    say(
      it.dialogue
    );

  }


  if(it.response){

    partnerResponse(
      it.response
    );

  }


  seedPhraseFromInterpretation(
    it
  );

}

/* =========================================================
   PHRASE FROM INTERPRETATION
========================================================= */

function seedPhraseFromInterpretation(it){

  if(
    (it.cute||0)>
    .12
  ){

    phrase.kind=
      "cute";

    phrase.until=
      sec()+
      rand(
        3.5,
        6.5
      );

    phrase.boost=
      .20;

    return;

  }


  if(
    (it.pursuit||0)>
    .22
  ){

    phrase.kind=
      partnerId==="shoma"
      ? "surge"
      : "pursuit";

    phrase.until=
      sec()+
      rand(
        3,
        6
      );

    phrase.boost=
      .22;

    return;

  }


  if(
    (it.desire||0)>
    .15
  ){

    phrase.kind=
      "rise";

    phrase.until=
      sec()+
      rand(
        2.8,
        5.2
      );

    phrase.boost=
      .16;

  }

}

/* =========================================================
   SHEET
========================================================= */

function renderSheet(tab){

  document
  .querySelectorAll(".tab")
  .forEach(
    b=>
    b.classList.toggle(
      "active",
      b.dataset.tab===tab
    )
  );


  const d=
    sheets[tab];


  sheetTitle.textContent=
    d.title;


  sheetButtons.innerHTML="";


  d.items.forEach(
    ([k,l])=>{

      const b=
        document.createElement("button");


      b.className=
        "action-button"+
        (
          tab==="state" &&
          states[k]
          ? " state-active"
          : ""
        );


      b.textContent=
        tab==="state" &&
        states[k]
        ? "● "+l
        : l;


      b.onclick=()=>{

        if(tab==="feel"){

          triggerFeel(k);

          sheet.classList.remove(
            "open"
          );

        }


        if(tab==="state"){

          toggleState(k);

        }


        if(tab==="action"){

          triggerAction(k);

          sheet.classList.remove(
            "open"
          );

        }

      };


      sheetButtons.appendChild(
        b
      );

    }
  );

}


document
.querySelectorAll(".tab")
.forEach(
  b=>
  b.addEventListener(
    "click",
    ()=>{

      if(mode!=="manual"){
        setMode(
          "manual"
        );

      renderSheet(
        b.dataset.tab
      );


      sheet.classList.add(

  )
);


closeSheet.onclick=()=>{

    )
  );

};

/* =========================================================
   AUTO
========================================================= */

function autoStep(){

  if(mode!=="auto")return;


  const r=
    Math.random();


  if(r<.16){

    const candidates=[
      "shy",
      "overwhelmed",
      "sweetVoice",
      "holdVoice"
    ];


    toggleState(
      pick(candidates)
    );

  }


  else if(r<.62){

    triggerFeel(
      pick([
        "like",
        "wantKiss",
        "wantClose",
        "more",
        "happy"
      ])
    );

  }


  else{

    let actions=[
      "stay",
      "lean",
      "hug",
      "kiss"
    ];


    if(
      states.shy &&
      chance(.28)
    ){

      actions.push(
        "shyEscape"
      );

    }


    if(
      states.overwhelmed &&
      chance(.25)
    ){

      actions.push(
        "sayMore"
      );

    }


    triggerAction(
      pick(actions)
    );

  }


  autoTimer=
    setTimeout(
      autoStep,
      rand(
        4700,
        9200
      )
    );

}


function startAuto(){

  stopAuto();

  autoTimer=
    setTimeout(
      autoStep,
      1500
    );

}


function stopAuto(){

  if(autoTimer){

    clearTimeout(
      autoTimer
    );

    autoTimer=null;

  }

}


/* =========================================================
   INTENT
========================================================= */

function cancelPendingIntent(reason){

  if(!intent.kind)return;


  addBackstage(
    `さっきまで考えていた「${intentLabel(intent.kind)}」は、${reason}のでいったん消えた。`
  );


  intent={
    kind:null,
    strength:0,
    created:0,
    due:0,
    reason:""
  };

}


function intentLabel(k){

  return(
    {
      approach:"もう少し近づく",
      watch:"もう少し見る",
      speak:"声をかける",
      tease:"少し構う",
      embrace:"抱き込む",
      kiss:"キスを返す",
      offer:"手を差し出す"
    }
  )[k]||k;

}


/* =========================================================
   SELF-INITIATED ACTION
========================================================= */

function maybeFormIntent(){

  if(
    world.pendingPartnerAction ||
    intent.kind
  )return;


  const p=
    profiles[partnerId];


  const sinceUser=
    sec()-
    world.lastUserActionAt;


  const sincePartner=
    sec()-
    world.lastPartnerActionAt;


  if(
    sincePartner<2.2 ||
    sinceUser<1.0
  )return;


  const activation=

    mind.desire*.42+

    mind.attention*.30+

    mind.pursuit*.20+

    mind.cuteAgg*.22-

    mind.restraint*.22;


  if(activation<.28)return;


  let candidates=[];


  if(mind.cuteAgg>.48){

    candidates.push({
      k:"embrace",
      w:
        mind.cuteAgg*
        (
          partnerId==="naoto"
          ? .55
          : 1
        )
    });


    candidates.push({
      k:"tease",
      w:
        mind.cuteAgg*
        (
          partnerId==="minato" ||
          partnerId==="shoma"
          ? 1.15
          : .8
        )
    });

  }


  if(
    mind.pursuit>.38 &&
    world.distance<4
  ){

    candidates.push({
      k:"approach",
      w:
        mind.pursuit*
        1.15
    });

  }


  if(mind.attention>.55){

    candidates.push({
      k:"watch",
      w:
        mind.attention*
        (
          partnerId==="naoto" ||
          partnerId==="hyunwoo"
          ? 1.2
          : .75
        )
    });

  }


  if(
    mind.desire>.56 &&
    world.distance>=3
  ){

    candidates.push({
      k:"kiss",
      w:
        mind.desire*
        (
          partnerId==="kei" ||
          partnerId==="shoma"
          ? 1.0
          : .65
        )
    });

  }


  candidates.push({
    k:"speak",
    w:
      .26+
      mind.attention*.35
  });


  if(
    partnerId==="hyunwoo" ||
    partnerId==="haruki"
  ){

    candidates.push({
      k:"offer",
      w:
        .22+
        mind.pursuit*.45
    });

  }


  if(!candidates.length)return;


  const total=
    candidates.reduce(
      (s,x)=>s+x.w,
      0
    );


  const r=
    Math.random()*
    total;


  let acc=0;

  let chosen=
    candidates[0].k;


  for(const c of candidates){

    acc+=
      c.w;

    if(r<=acc){

      chosen=
        c.k;

      break;

    }

  }


  if(
    !chance(
      p.initiative*
      (
        .58+
        activation*.62
      )
    )
  )return;


  const d=
    rand(
      p.decisionDelay[0],
      p.decisionDelay[1]
    );


  intent={
    kind:chosen,
    strength:activation,
    created:sec(),
    due:
      sec()+
      d/1000,
    reason:

/* =========================================================

========================================================= */

function revalidateIntent(){

  if(
    !intent.kind ||
    world.pendingPartnerAction
  )return;


  if(sec()<intent.due)return;


  const p=
    profiles[partnerId];


  if(
    sec()-
    world.lastUserActionAt<
    .75
  ){

    cancelPendingIntent(
      "直前に彩音が動いた"
    );

    return;

  }


  if(
    intent.kind==="kiss" &&
    world.distance<3
  ){

    intent.kind=
      "approach";

  }


  if(
    intent.kind==="embrace" &&
    world.distance<2
  ){

    intent.kind=
      "approach";

  }


  const safety=
    recentAny(
      [
        "ayaneLeave",
        "ayaneEscape"
      ],
      6
    );


  if(
    safety &&
    (
      intent.kind==="approach" ||
      intent.kind==="embrace" ||
      intent.kind==="kiss"
    )
  ){

    cancelPendingIntent(
      "彩音が距離を取った直後だった"
    );

    return;

  }


  executePartnerIntent(
    intent.kind,
    p
  );


  intent={
    kind:null,
    strength:0,
    created:0,
    due:0,
    reason:""
  };

}

/* =========================================================
   MIND ENGINE
========================================================= */

function updateMind(dt){

  const p=
    profiles[partnerId];


  mind.attention=
    lerp(
      mind.attention,
      .28,
      1-
      Math.exp(
        -dt*.11
      )
    );


  const desireTarget=
    .26+
    mind.attention*.12;


  mind.desire=
    lerp(
      mind.desire,
      desireTarget,
      1-
      Math.exp(
        -dt*
        p.decay*
        2.2
      )
    );


  mind.pursuit=
    lerp(
      mind.pursuit,
      .16,
      1-
      Math.exp(
        -dt*.09
      )
    );


  mind.cuteAgg=
    lerp(
      mind.cuteAgg,
      .06,
      1-
      Math.exp(
        -dt*.055
      )
    );


  mind.uncertainty=
    lerp(
      mind.uncertainty,
      .16,
      1-
      Math.exp(
        -dt*.08
      )
    );


  const naturalRestraint=

    p.regulation*

    (
      1-
      mind.pursuit*.30
    );


  mind.restraint=
    lerp(
      mind.restraint,
      naturalRestraint,
      1-
      Math.exp(
        -dt*.65
      )
    );

}


/* =========================================================
   CAPSULE TARGETS
========================================================= */

function targetValues(){

  const p=
    profiles[partnerId];


  const inner=
    clamp(

      .18+

      mind.desire*.52+

      mind.attention*.16+

      mind.pursuit*.14+

      mind.cuteAgg*.16,

      .12,

      1

    );


  const leakage=
    clamp(

      p.impulse*

      (
        1-
        mind.restraint*.58
      ),

      .12,

      .90

    );


  let external=
    clamp(

      .16+

      mind.desire*
      leakage*
      p.expressionGain+

      mind.pursuit*.17+

      mind.cuteAgg*.08,

      .14,

      1

    );


  if(
    phrase.kind==="pause" &&
    sec()<phrase.pauseUntil
  ){

    external*=
      .62;

  }


  const tempo=
    lerp(
      p.baseTempo,
      p.maxTempo,
      external
    );


  const intensity=
    lerp(
      p.baseIntensity,
      p.maxIntensity,
      external
    );


  return{
    inner,
    external,
    tempo,
    intensity
  };

}


/* =========================================================
   BASE WAVE
========================================================= */

function waveShape(
  type,
  x
){

  const s=
    Math.sin(x);


  if(type==="steady"){
    return s;
  }


  if(type==="hold"){

    return(
      Math.sign(s)*
      Math.pow(
        Math.abs(s),
        .78
      )
    );

  }


  if(type==="burst"){

    return(
      Math.sign(s)*
      Math.pow(
        Math.abs(s),
        .48
      )
    );

  }


  if(type==="responsive"){

    return clamp(

      s*.78+

      Math.sin(
        x*1.72
      )*.22,

      -1,

      1

    );

  }


  if(type==="variable"){

    return clamp(

      s*.76+

      Math.sin(
        x*.46
      )*.17+

      Math.sin(
        x*1.31
      )*.07,

      -1,

      1

    );

  }


  if(type==="controlled"){

    return Math.sin(

      x+

      .24*
      Math.sin(
        x*.48
      )

    );

  }


  return s;

}


/* =========================================================
   PHRASE WAVE
========================================================= */

function phraseWave(base){

  if(sec()>phrase.until){

    phrase={
      kind:"normal",
      until:0,
      pauseUntil:0,
      boost:0,
      hold:0
    };

    return base;

  }


  if(
    phrase.kind==="pause" &&
    sec()<phrase.pauseUntil
  ){

    return lerp(
      base,
      0,
      .55
    );

  }


  if(phrase.kind==="surge"){

    return clamp(

      base*1.1+

      Math.sin(
        phase*2.05
      )*.18,

      -1,

      1

    );

  }


  if(phrase.kind==="pursuit"){

    return clamp(
      base*.90+.18,
      -1,
      1
    );

  }


  if(phrase.kind==="hold"){

    return clamp(
      base*.72+.28,
      -1,
      1
    );

  }


  if(phrase.kind==="cute"){

    return clamp(

      base*.82+

      Math.sin(
        phase*.52
      )*.16+

      .08,

      -1,

      1

    );

  }


  if(phrase.kind==="rise"){

    return clamp(
      base*.95+.10,
      -1,
      1
    );

  }


  return base;

}


/* =========================================================
   RAF
========================================================= */

function frame(now){

  const dt=
    Math.min(
      (
        now-
        lastFrame
      )/1000,
      .05
    );


  lastFrame=
    now;


  updateMind(
    dt
  );


  const target=
    targetValues();


  rendered.tempo=
    lerp(
      rendered.tempo ||
      target.tempo,
      target.tempo,
      1-
      Math.exp(
        -dt*1.55
      )
    );


  rendered.intensity=
    lerp(
      rendered.intensity ||
      target.intensity,
      target.intensity,
      1-
      Math.exp(
        -dt*1.45
      )
    );


  rendered.inner=
    lerp(
      rendered.inner ||
      target.inner,
      target.inner,
      1-
      Math.exp(
        -dt*1.25
      )
    );


  let frequency=
    .24+
    rendered.tempo*.18;


  if(
    phrase.kind==="surge"
  ){

    frequency*=
      1.18;

  }


  if(
    phrase.kind==="pause" &&
    sec()<phrase.pauseUntil
  ){

    frequency*=
      .35;

  }


  phase+=

    Math.PI*
    2*
    frequency*
    dt;


  const p=
    profiles[partnerId];


  let wave=
    (
      phraseWave(
        waveShape(
          p.motion,
          phase
        )
      )+
      1
    )/2;


  const n=
    clamp(
      rendered.intensity/
      10,
      0,
      1
    );


  const minHeight=
    34;


  const amplitude=

    46+

    n*108+

    (
      phrase.boost||
      0
    )*30;


  const height=
    minHeight+
    wave*
    amplitude;


  fill.style.height=
    height+"px";


  fill.classList.toggle(

    "hot",

    target.external>.68 ||
    mind.cuteAgg>.62

  );


  const shellHeight=
    52+
    rendered.inner*
    150;


  const shellWidth=
    68+
    rendered.inner*
    30;


  innerShell.style.height=
    shellHeight+"px";


  innerShell.style.width=
    shellWidth+"px";


  requestAnimationFrame(
    frame
  );

}
