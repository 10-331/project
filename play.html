<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dyad Interaction Simulator v2</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#050505;
  --panel:#101010;
  --line:#292929;
  --soft:#181818;
  --text:#eee;
  --muted:#8e8e8e;
  --cream:#eee8df;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  padding-bottom:96px;
}

button,select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:min(760px,100%);
  margin:auto;
  padding:10px 8px 40px;
}

/* =========================
   TOP
========================= */

.top{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(5,5,5,.94);
  backdrop-filter:blur(14px);
  padding:7px 0 9px;
}

.top-row{
  display:flex;
  gap:7px;
  align-items:center;
}

.partner-select{
  flex:1;
  min-width:0;
  background:#151515;
  color:#eee;
  border:1px solid #333;
  border-radius:14px;
  padding:9px 10px;
  font-weight:700;
}

.icon-btn{
  border:1px solid #333;
  background:#171717;
  color:#ddd;
  border-radius:14px;
  padding:9px 11px;
  white-space:nowrap;
}

.icon-btn.active{
  background:var(--cream);
  color:#111;
  border-color:var(--cream);
}

.mode-row{
  display:flex;
  gap:6px;
  margin-top:7px;
}

.mode-btn{
  flex:1;
  border:1px solid #333;
  background:#171717;
  color:#aaa;
  border-radius:13px;
  padding:7px;
  font-size:12px;
}

.mode-btn.active{
  background:var(--cream);
  color:#111;
  border-color:var(--cream);
  font-weight:700;
}

/* =========================
   MAIN STAGE
========================= */

.stage{
  position:relative;
  min-height:570px;
  border:1px solid #242424;
  border-radius:24px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 35%,#171717 0,#090909 48%,#050505 78%);
}

.partner{
  position:absolute;
  top:30px;
  left:50%;
  width:100%;
  transform:translateX(-50%);
  text-align:center;
}

.partner-name{
  font-size:23px;
  font-weight:750;
}

.partner-status{
  min-height:20px;
  color:#8e8e8e;
  font-size:12px;
  margin-top:4px;
}

/* =========================
   CAPSULE
========================= */

.capsule-zone{
  position:relative;
  width:112px;
  height:220px;
  margin:14px auto 0;
}

.inner-shell{
  position:absolute;
  left:50%;
  bottom:5px;
  width:84px;
  height:80px;
  transform:translateX(-50%);
  border-radius:48px;
  border:2px solid rgba(238,232,223,0);
  background:rgba(238,232,223,0);
  filter:drop-shadow(0 0 0 rgba(255,255,255,0));
  transition:
    border-color .3s,
    background .3s,
    filter .3s;
}

.stage.backstage-on .inner-shell{
  border-color:rgba(238,232,223,.23);
  background:rgba(238,232,223,.025);
  filter:drop-shadow(0 0 8px rgba(255,255,255,.12));
}

.track{
  position:absolute;
  left:50%;
  bottom:5px;
  width:64px;
  height:210px;
  transform:translateX(-50%);
  border-radius:38px;
  background:#211c1a;
  border:1px solid #493d38;
  overflow:hidden;
}

.fill{
  position:absolute;
  left:7px;
  right:7px;
  bottom:7px;
  height:58px;
  border-radius:30px;
  background:var(--cream);
  will-change:height;
  box-shadow:0 0 0 rgba(255,255,255,0);
}

.fill.hot{
  box-shadow:0 0 15px rgba(255,255,255,.28);
}

/* =========================
   SPEECH
========================= */

.speech{
  position:absolute;
  top:300px;
  left:50%;
  width:min(88%,430px);
  transform:translateX(-50%);
  text-align:center;
  pointer-events:none;
}

.speech-bubble{
  display:inline-block;
  min-height:30px;
  max-width:100%;
  padding:9px 14px;
  border-radius:17px;
  background:rgba(238,232,223,.95);
  color:#111;
  font-size:14px;
  line-height:1.55;
  opacity:0;
  transform:translateY(5px);
  transition:.25s;
}

.speech-bubble.show{
  opacity:1;
  transform:translateY(0);
}

/* =========================
   SIGNAL
========================= */

.signal-lane{
  position:absolute;
  top:365px;
  bottom:145px;
  left:50%;
  width:160px;
  transform:translateX(-50%);
  pointer-events:none;
}

.signal{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  font-size:12px;
  padding:6px 10px;
  border:1px solid rgba(238,232,223,.45);
  border-radius:14px;
  background:rgba(8,8,8,.88);
  color:#ddd;
  white-space:nowrap;
  opacity:0;
}

.signal.fly{
  animation:signalFly 1.15s ease-out forwards;
}

.signal.missed{
  animation:signalMiss 1.15s ease-out forwards;
}

@keyframes signalFly{
  0%{bottom:0;opacity:0;transform:translateX(-50%) scale(.9)}
  12%{opacity:1}
  80%{opacity:1}
  100%{bottom:118px;opacity:0;transform:translateX(-50%) scale(1.03)}
}

@keyframes signalMiss{
  0%{bottom:0;opacity:0}
  15%{opacity:1}
  65%{opacity:.55}
  100%{bottom:70px;opacity:0;transform:translateX(-50%) translateX(30px)}
}

/* =========================
   AYANE
========================= */

.ayane{
  position:absolute;
  bottom:35px;
  left:50%;
  width:92%;
  transform:translateX(-50%);
  text-align:center;
}

.ayane-name{
  font-size:18px;
  font-weight:700;
}

.ayane-visible{
  min-height:44px;
  margin-top:8px;
  color:#ddd;
  font-size:14px;
  line-height:1.55;
}

.ayane-sub{
  min-height:18px;
  color:#777;
  font-size:11px;
  margin-top:3px;
}

.active-states{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:5px;
  margin-top:9px;
  min-height:27px;
}

.state-pill{
  border-radius:14px;
  padding:5px 9px;
  background:#242424;
  color:#d8d8d8;
  font-size:11px;
}

/* =========================
   EVENT STRIP
========================= */

.event-strip{
  margin-top:8px;
  min-height:54px;
  padding:10px 12px;
  border:1px solid #242424;
  border-radius:17px;
  background:#0e0e0e;
}

.event-time{
  font-size:10px;
  color:#666;
}

.event-text{
  margin-top:3px;
  font-size:13px;
  line-height:1.5;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  z-index:60;
  left:0;
  right:0;
  bottom:0;
  padding:
    8px
    max(8px,env(safe-area-inset-right))
    calc(8px + env(safe-area-inset-bottom))
    max(8px,env(safe-area-inset-left));
  background:rgba(8,8,8,.96);
  border-top:1px solid #292929;
  backdrop-filter:blur(16px);
}

.bottom-inner{
  width:min(760px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.tab{
  border:1px solid #333;
  border-radius:15px;
  background:#171717;
  color:#ccc;
  padding:10px 4px;
  font-weight:700;
}

.tab.active{
  background:var(--cream);
  color:#111;
  border-color:var(--cream);
}

/* =========================
   BOTTOM SHEET
========================= */

.sheet{
  position:fixed;
  z-index:55;
  left:0;
  right:0;
  bottom:0;
  transform:translateY(110%);
  transition:transform .26s cubic-bezier(.25,.8,.25,1);
  padding:
    12px
    max(10px,env(safe-area-inset-right))
    calc(82px + env(safe-area-inset-bottom))
    max(10px,env(safe-area-inset-left));
  background:rgba(15,15,15,.98);
  border-top:1px solid #353535;
  border-radius:22px 22px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.5);
}

.sheet.open{
  transform:translateY(0);
}

.sheet-inner{
  width:min(760px,100%);
  margin:auto;
}

.sheet-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
  font-size:13px;
  font-weight:700;
}

.close-sheet{
  border:none;
  background:none;
  color:#888;
  font-size:20px;
}

.button-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.action-button{
  min-height:48px;
  border:1px solid #363636;
  border-radius:15px;
  background:#1c1c1c;
  color:#eee;
  padding:9px;
}

.action-button:active{
  transform:scale(.97);
}

.action-button.state-active{
  background:var(--cream);
  color:#111;
  border-color:var(--cream);
  font-weight:700;
}

/* =========================
   BACKSTAGE DRAWER
========================= */

.drawer-mask{
  position:fixed;
  inset:0;
  z-index:79;
  background:rgba(0,0,0,.52);
  opacity:0;
  pointer-events:none;
  transition:.22s;
}

.drawer-mask.show{
  opacity:1;
  pointer-events:auto;
}

.drawer{
  position:fixed;
  z-index:80;
  top:0;
  right:0;
  bottom:0;
  width:min(88vw,390px);
  transform:translateX(105%);
  transition:transform .26s ease;
  background:#101010;
  border-left:1px solid #333;
  padding:
    calc(15px + env(safe-area-inset-top))
    14px
    calc(20px + env(safe-area-inset-bottom));
  overflow:auto;
}

.drawer.show{
  transform:translateX(0);
}

.drawer-head{
  position:sticky;
  top:0;
  background:#101010;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:12px;
  border-bottom:1px solid #292929;
}

.drawer-title{
  font-weight:750;
}

.log-entry{
  padding:14px 1px;
  border-bottom:1px solid #292929;
}

.log-meta{
  color:#777;
  font-size:10px;
  margin-bottom:5px;
}

.log-body{
  color:#ddd;
  font-size:13px;
  line-height:1.75;
  white-space:pre-line;
}

/* =========================
   AUTO BANNER
========================= */

.auto-banner{
  display:none;
  margin-top:8px;
  padding:9px 12px;
  border-radius:14px;
  background:#171717;
  color:#aaa;
  font-size:11px;
  text-align:center;
}

.auto-banner.show{
  display:block;
}

@media(max-width:390px){
  .stage{min-height:550px}
  .capsule-zone{height:205px}
  .track{height:195px}
  .speech{top:284px}
  .signal-lane{top:347px}
}
</style>
</head>

<body>

<div class="app">

  <div class="top">

    <div class="top-row">

      <select id="partnerSelect" class="partner-select">
        <option value="naoto">桐谷直人</option>
        <option value="kei" selected>黒川慧</option>
        <option value="shoma">朝倉翔馬</option>
        <option value="minato">三浦湊</option>
        <option value="haruki">宮田晴輝</option>
        <option value="hyunwoo">チェ・ヒョヌ</option>
      </select>

      <button id="backstageBtn" class="icon-btn">
        彼ログ
      </button>

      <button id="dialogueBtn" class="icon-btn active">

      </button>

    </div>

    <div class="mode-row">
      <button id="manualBtn" class="mode-btn active">
        操作する
      </button>
      <button id="autoBtn" class="mode-btn">
        AUTOに任せる
      </button>
      <button id="resetBtn" class="mode-btn">
        Reset
      </button>
    </div>

  </div>


  <div id="stage" class="stage">

    </div>

    <div id="signalLane" class="signal-lane"></div>


    <div class="ayane">

      </div>

  <div id="autoBanner" class="auto-banner">
    AUTO中。今の状態を維持したまま「操作する」に戻せます。

  <div class="event-strip">
    <div id="eventTime" class="event-time">00:00</div>
    <div id="eventText" class="event-text">
      Session start
    </div>
  </div>

</div>


<!-- BOTTOM SHEET -->

<div id="sheet" class="sheet">
  <div class="sheet-inner">

    <div class="sheet-title">
      <span id="sheetTitle">気持ち</span>
      <button id="closeSheet" class="close-sheet">×</button>
    </div>

    <div id="sheetButtons" class="button-grid"></div>

  </div>
</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">
  <div class="bottom-inner">

    <button class="tab" data-tab="feel">
      ♡ 気持ち
    </button>

    <button class="tab" data-tab="state">
      ● STATE
    </button>

    <button class="tab" data-tab="action">
      → ACTION
    </button>

  </div>
</div>


<!-- BACKSTAGE -->

<div id="drawerMask" class="drawer-mask"></div>

<div id="drawer" class="drawer">

  <div class="drawer-head">
    <div>
      <div class="drawer-title">
        彼ログ
      </div>
      <div style="font-size:10px;color:#777;margin-top:3px">
        BACKSTAGE
      </div>
    </div>

    <button id="closeDrawer" class="icon-btn">
      閉じる
    </button>
  </div>

  <div id="backstageLog"></div>

</div>


<script>

/* =========================================================
   PROFILE
========================================================= */

const profiles={

  naoto:{

    baseTempo:3.7,
    maxTempo:5.0,

    baseIntensity:4.7,

  shoma:{

    baseIntensity:6.6,

    desireGain:1.00,
    expressionGain:.92,

    impulse:.90,
    regulation:.60,

    notice:{

      gaze:.84,
      voice:.90,

    },

    baseIntensity:5.5,
    maxIntensity:7.0,

    desireGain:.84,
    expressionGain:.76,

    impulse:.74,
    regulation:.66,

    notice:{
      face:.97,
      gaze:.93,
      voice:.92,
      distance:.82,
      action:.98
    },

    noticeDelay:[240,800],

    decay:.017,

    motion:"responsive"
  },


  haruki:{
    name:"晴輝",

    baseTempo:3.7,
    maxTempo:6.0,

    baseIntensity:5.5,
    maxIntensity:8.0,

    desireGain:.79,
    expressionGain:.69,

    impulse:.72,
    regulation:.66,

    notice:{
      face:.86,
      gaze:.84,
      voice:.85,
      distance:.86,

    },

    noticeDelay:[360,1100],

    decay:.021,

  },


  hyunwoo:{
    name:"ヒョヌ",

    baseTempo:3.6,

    baseIntensity:6.6,
    maxIntensity:8.0,

    desireGain:.86,
    expressionGain:.66,

    impulse:.61,
    regulation:.87,

    notice:{
      face:.93,
      gaze:.91,
      voice:.94,
      distance:.93,
      action:.99
    },

    noticeDelay:[500,1350],

    decay:.011,

    motion:"controlled"
  }
};


/* =========================================================
   UI DATA
========================================================= */

const sheets={

  feel:{
    title:"瞬間の気持ち",
    items:[
      ["like","すき"],
      ["more","もっと"],
      ["wantKiss","キスしたい"],
      ["wantClose","くっつきたい"],
      ["happy","嬉しい"]
    ]
  },

  state:{
    title:"現在のSTATE",
    items:[
      ["shy","恥ずかしい"],
      ["overwhelmed","余裕ない"],
      ["sweetVoice","声が甘くなる"],
      ["holdVoice","声を我慢する"]
    ]
  },

  action:{
    title:"彩音のACTION",
    items:[
      ["kiss","キスする"],
      ["hug","抱きつく"],
      ["lean","顔を寄せる"],
      ["stay","そのまま近くにいる"],
      ["leave","少し離れる"],
      ["shyEscape","恥ずかしくて逃げる"],
      ["sayMore","「もっと」と言う"]
    ]
  }
};


/* =========================================================
   STATE
========================================================= */

let partnerId="kei";
let mode="manual";
let dialogueEnabled=true;
let backstageOpen=false;

let sessionStart=performance.now();

let states={
  shy:false,
  overwhelmed:false,
  sweetVoice:false,
  holdVoice:false
};

/*
  Internal partner state.

  desire:
  内側の高まり

  attention:
  彩音への注意集中

  pursuit:
  自分から追いたい方向

  restraint:
  行動として抑えている量
*/

let mind={
  desire:.28,
  attention:.30,
  pursuit:.18,
  restraint:.55
};


/*
  rendered values are smoothed.
*/

let rendered={
  tempo:0,
  intensity:0,
  inner:0
};

let phase=0;
let lastFrame=performance.now();

let memory=[];
let dialogueTimer=null;
let autoTimer=null;


/* =========================================================
   DOM
========================================================= */

const stage=document.getElementById("stage");

const partnerSelect=
document.getElementById("partnerSelect");

const partnerName=
document.getElementById("partnerName");

const partnerStatus=
document.getElementById("partnerStatus");

const fill=
document.getElementById("fill");

const innerShell=
document.getElementById("innerShell");

const speechBubble=
document.getElementById("speechBubble");

const signalLane=
document.getElementById("signalLane");

const ayaneVisible=
document.getElementById("ayaneVisible");

const ayaneSub=
document.getElementById("ayaneSub");

const activeStates=
document.getElementById("activeStates");

const eventTime=
document.getElementById("eventTime");

const eventText=
document.getElementById("eventText");

const manualBtn=
document.getElementById("manualBtn");

const autoBtn=
document.getElementById("autoBtn");

const resetBtn=
document.getElementById("resetBtn");

const autoBanner=
document.getElementById("autoBanner");

const dialogueBtn=
document.getElementById("dialogueBtn");

const backstageBtn=
document.getElementById("backstageBtn");

const sheet=
document.getElementById("sheet");

const sheetTitle=
document.getElementById("sheetTitle");

const sheetButtons=
document.getElementById("sheetButtons");

document.getElementById("closeSheet");

document.getElementById("drawer");

document.getElementById("drawerMask");

document.getElementById("closeDrawer");

const backstageLog=
document.getElementById("backstageLog");


/* =========================================================
   HELPERS
========================================================= */

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function lerp(a,b,t){
  return a+(b-a)*t;
}

function chance(p){
  return Math.random()<p;
}

function rand(a,b){
  return a+Math.random()*(b-a);
}

function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function sec(){
  return (performance.now()-sessionStart)/1000;
}

function timeString(){
  const total=Math.floor(sec());
  const m=String(Math.floor(total/60)).padStart(2,"0");
  const s=String(total%60).padStart(2,"0");
  return `${m}:${s}`;
}


/* =========================================================
   EVENT
========================================================= */

function showEvent(text){

  eventTime.textContent=timeString();
  eventText.textContent=text;

}


/* =========================================================
   MEMORY
========================================================= */

function remember(type,data={}){

  memory.push({
    time:sec(),
    type,
    ...data
  });

  if(memory.length>40){
    memory.shift();
  }
}


function recent(type,within=14){

  const now=sec();

  return memory
  .slice()
  .reverse()
  .find(
    x=>
    x.type===type &&
    now-x.time<=within
  );
}


function recentAny(types,within=14){

  const now=sec();

  return memory
  .slice()
  .reverse()
  .find(
    x=>
    types.includes(x.type) &&
    now-x.time<=within
  );
}

/* =========================================================
   SIGNAL ANIMATION
========================================================= */

function signal(text,noticed=true){

  const el=
  document.createElement("div");

  el.className=
  "signal "+(
    noticed
    ? "fly"
    : "missed"
  );

  el.textContent=text;

  signalLane.appendChild(el);

  setTimeout(
    ()=>el.remove(),
    1300
  );
}


/* =========================================================
   SPEECH
========================================================= */

function say(text){

  if(!dialogueEnabled || !text)return;

  clearTimeout(dialogueTimer);

  speechBubble.textContent=
  `「${text}」`;

  speechBubble.classList.add("show");

  dialogueTimer=
  setTimeout(
    ()=>{
      speechBubble.classList.remove("show");
    },
    3300
  );
}

/* =========================================================
   PERCEPTION
========================================================= */

function processCues(cues,source){

  const p=
  profiles[partnerId];

  if(cues.length===0){

    ayaneVisible.textContent=
    "大きな変化は表に出なかった";

    ayaneSub.textContent=
    "彼に新しい情報は届いていない";

    return;
  }


  const strongest=
  [...cues].sort(
    (a,b)=>b.power-a.power
  )[0];


  ayaneVisible.textContent=
  strongest.text;

  ayaneSub.textContent=
  cues.length>1
    ? cues
        .filter(x=>x!==strongest)
        .map(x=>x.text)
        .join("・")
    : "彼が気づくかはまだ分からない";


  const noticed=[];


  cues.forEach(cue=>{

    const base=
      p.notice[cue.channel] ?? .65;

    const probability=
      clamp(
        base *
        (.56 + cue.power*.52),
        .05,
        .995
      );

    if(chance(probability)){
      noticed.push(cue);
    }
  });


  /*
    signal visuals immediately show
    whether external cue reaches attention.
  */

  cues.forEach(cue=>{

    signal(
      cue.channel==="face"
        ? "表情"
        : cue.channel==="gaze"
        ? "視線"
        : cue.channel==="voice"
        ? "声"
        : cue.channel==="distance"
        ? "距離"
        : "行動",

      noticed.includes(cue)
    );

  });


  const delay=
    rand(
      p.noticeDelay[0],
      p.noticeDelay[1]
    );


  setTimeout(
    ()=>{
      interpret(
        source,
        cues,
        noticed
      );
    },
    delay
  );
}


/* =========================================================
   INTERPRETATION
========================================================= */

function interpret(source,cues,noticed){

  const p=
  profiles[partnerId];


  if(noticed.length===0){

    if(chance(.55)){

      addBackstage(
        missedText(partnerId)
      );
    }

    return;
  }


  const strongest=
  [...noticed].sort(
    (a,b)=>b.power-a.power
  )[0];


  const signalStrength=
    noticed.reduce(
      (sum,x)=>sum+x.power,
      0
    ) / noticed.length;


  /*
    Attention moves first.
    Desire may or may not follow.
  */

  mind.attention=
    clamp(
      mind.attention +
      signalStrength*.20,
      0,
      1
    );


  const interpretation=
    interpretMeaning(
      source,
      noticed
    );


  /*
    Internal desire change depends on
    what he thinks the cue means.
  */

  mind.desire=
    clamp(
      mind.desire +
      interpretation.desire *
      p.desireGain,
      0,
      1
    );


  mind.pursuit=
    clamp(
      mind.pursuit +
      interpretation.pursuit,
      0,
      1
    );


  remember(
    "noticed",
    {
      source,
      meaning:interpretation.meaning
    }
  );


  addBackstage(
    interpretation.inner
  );


  if(interpretation.status){
    partnerStatus.textContent=
      interpretation.status;
  }


  if(interpretation.public){
    showEvent(
      interpretation.public
    );
  }


  if(interpretation.dialogue){
    say(
      interpretation.dialogue
    );
  }


  /*
    Some responses create a second event.
  */

  if(interpretation.response){
    partnerResponse(
      interpretation.response
    );
  }
}

        remember(
          "partnerPursuit"

          );

        mind.pursuit=
          clamp(
            mind.pursuit+.12,
            0,1
          );

      },
      520
    );

  if(type==="follow"){

    setTimeout(
      ()=>{
        showEvent(
          `${profiles[partnerId].name}がそのまま追って距離を戻す。`
        );

        remember(
          "partnerPursuit"
        );

        mind.pursuit=
          clamp(
            mind.pursuit+.10,
            0,1
          );

      },
      420
    );
  }


  if(type==="offerHand"){

    setTimeout(
      ()=>{
        showEvent(
          `${profiles[partnerId].name}が追い切らず、彩音へ手を伸ばす。`
        );

        remember(
          "partnerOffer"
        );

      500
    );
  }
}

/* =========================================================
   INPUT HANDLER
========================================================= */

function triggerFeel(type){

  const labels={
    like:"すき",
    more:"もっと",
    wantKiss:"キスしたい",
    wantClose:"くっつきたい",
    happy:"嬉しい"
  };


  showEvent(
    `彩音：［${labels[type]}］`
  );


  remember(
    "internalFeel",
    {type}
  );


  const cues=
    feelCues(type);


  if(
    type==="like" ||
    type==="more" ||
    type==="happy"
  ){
    remember(
      "positiveCue"
    );
  }


  processCues(
    cues,
    "feel:"+type
  );
}


/* =========================================================
   ACTION HANDLER
========================================================= */

function triggerAction(type){

  const labels={
    kiss:"彩音からキスする",
    hug:"彩音から抱きつく",
    lean:"彩音から顔を寄せる",
    stay:"彩音がそのまま近くにいる",
    leave:"彩音が少し離れる",
    shyEscape:"彩音が恥ずかしくなって逃げようとする",
    sayMore:"彩音が「もっと」と伝える"
  };


  showEvent(labels[type]);


  if(type==="kiss"){
    remember("ayaneKiss");
  }

  if(type==="hug"){
    remember("ayaneHug");
  }

  if(type==="lean"){
    remember("ayaneLean");
  }

  if(type==="stay"){
    remember("ayaneStay");
  }


  if(type==="leave"){

    mind.pursuit=
      clamp(
        mind.pursuit-.07,
        0,1
      );

    remember("ayaneLeave");
  }


  if(type==="shyEscape"){

    remember("ayaneEscape");
  }


  processCues(
    actionCues(type),
    type
  );
}


/* =========================================================
   STATE TOGGLE
========================================================= */

function toggleState(key){

  states[key]=
    !states[key];

  renderStates();

  renderSheet("state");


  if(states[key]){

    showEvent(
      `彩音STATE：${stateLabels[key]}`
    );

    if(key==="shy"){

      ayaneVisible.textContent=
        "恥ずかしさが続いている";

      ayaneSub.textContent=

    }


    if(key==="overwhelmed"){

      ayaneVisible.textContent=
        "余裕がなくなってきている";

      ayaneSub.textContent=
        "次の気持ちが表へ漏れやすくなる";
    }


    if(key==="sweetVoice"){

      ayaneVisible.textContent=
        "次に声を出した時、声色が変わりやすい";

      ayaneSub.textContent=
        "黙っている間は彼には分からない";
    }


    if(key==="holdVoice"){

      ayaneVisible.textContent=
        "声を抑えようとしている";

      ayaneSub.textContent=

      `${stateLabels[key]}が落ち着いた`;

    ayaneSub.textContent=
      "次の反応は現在のSTATEから処理される";

  }
}


/* =========================================================
   SHEET
========================================================= */

function renderSheet(tab){

  document
  .querySelectorAll(".tab")
  .forEach(
    btn=>
    btn.classList.toggle(
      "active",
      btn.dataset.tab===tab
    )
  );


  const data=sheets[tab];

  sheetTitle.textContent=data.title;

  sheetButtons.innerHTML="";


  data.items.forEach(
    ([key,label])=>{

      const button=
        document.createElement("button");

      button.className=
        "action-button";


      if(
        tab==="state" &&
        states[key]
      ){
        button.classList.add(
          "state-active"
        );
      }


      button.textContent=
        tab==="state" && states[key]
        ? "● "+label
        : label;


      button.onclick=()=>{

        if(tab==="feel"){
          triggerFeel(key);
          sheet.classList.remove("open");
        }

        if(tab==="state"){
          toggleState(key);
        }

        if(tab==="action"){
          triggerAction(key);
          sheet.classList.remove("open");
        }

      };


      sheetButtons.appendChild(
        button
      );

    }
  );

}


document
.querySelectorAll(".tab")
.forEach(btn=>{

  btn.addEventListener(
    "click",
    ()=>{

      if(mode!=="manual"){
        setMode("manual");
      }

      renderSheet(
        btn.dataset.tab
      );

      sheet.classList.add("open");

    }
  );

});


closeSheet.onclick=()=>{

  sheet.classList.remove("open");

  document
  .querySelectorAll(".tab")
  .forEach(

};

/* =========================================================
   AUTO

   LAB-only generated Ayane actions.
========================================================= */

function autoStep(){

  if(mode!=="auto")return;


  const r=Math.random();


  if(r<.18){

    const candidates=[
      "shy",
      "overwhelmed",
      "sweetVoice"
    ];

    toggleState(
      pick(candidates)
    );

  }

  else if(r<.66){

    triggerFeel(
      pick([
        "like",
        "wantKiss",
        "wantClose",
        "more",
        "happy"
      ])
    );

  }

  else{

    let actions=[
      "stay",
      "lean",
      "hug",
      "kiss"
    ];


    if(states.shy && chance(.26)){
      actions.push("shyEscape");
    }


    triggerAction(
      pick(actions)
    );

  }


  autoTimer=
    setTimeout(
      autoStep,
      rand(
        4300,
        8500
      )
    );
}


function startAuto(){

  stopAuto();

  autoTimer=
    setTimeout(
      autoStep,
      1300
    );
}


function stopAuto(){

  if(autoTimer){
    clearTimeout(autoTimer);
    autoTimer=null;
  }
}


/* =========================================================
   CONTINUOUS MIND ENGINE
========================================================= */

function updateMind(dt){

  const p=
    profiles[partnerId];


  /*
    attention gradually relaxes
  */

  mind.attention=
    lerp(
      mind.attention,
      .28,
      1-Math.exp(-dt*.11)
    );


  /*
    desire decays slowly,
    but not instantly after input.
  */

  const desireTarget=
    .26 +
    mind.attention*.12;


  mind.desire=
    lerp(
      mind.desire,
      desireTarget,
      1-Math.exp(
        -dt*p.decay*2.2
      )
    );


  /*
    pursuit also settles.
  */

  mind.pursuit=
    lerp(
      mind.pursuit,
      .16,
      1-Math.exp(-dt*.09)
    );


  /*
    restraint is person-specific,
    but heightened pursuit can reduce
    how much stays hidden.
  */

  const naturalRestraint=
    p.regulation *
    (
      1-
      mind.pursuit*.30
    );


  mind.restraint=
    lerp(
      mind.restraint,
      naturalRestraint,
      1-Math.exp(-dt*.65)
    );

}


/* =========================================================
   CAPSULE TARGETS
========================================================= */

function targetValues(){

  const p=
    profiles[partnerId];


  /*
    Inner level = mind itself.
  */

  const inner=
    clamp(
      .18 +
      mind.desire*.58 +
      mind.attention*.18 +
      mind.pursuit*.16,
      .12,
      1
    );


  /*
    What becomes externally visible.

    impulse / restraint determine
    how much of inner state reaches motion.
  */

  const leakage=
    clamp(
      p.impulse *
      (
        1-
        mind.restraint*.58
      ),
      .12,
      .90
    );


  const external=
    clamp(
      .18 +
      mind.desire *
      leakage *
      p.expressionGain +
      mind.pursuit*.18,
      .16,
      1
    );


  const tempo=
    lerp(
      p.baseTempo,
      p.maxTempo,
      external
    );


  const intensity=
    lerp(
      p.baseIntensity,
      p.maxIntensity,
      external
    );


  return{
    inner,
    external,
    tempo,
    intensity
  };
}


/* =========================================================
   MOTION WAVE
========================================================= */

function waveShape(type,x){

  const s=Math.sin(x);


  if(type==="steady"){
    return s;
  }


  if(type==="hold"){

    return Math.sign(s) *
      Math.pow(
        Math.abs(s),
        .78
      );
  }


  if(type==="burst"){

    return Math.sign(s) *
      Math.pow(
        Math.abs(s),
        .48
      );
  }


  if(type==="responsive"){

    return clamp(
      s*.78 +
      Math.sin(x*1.72)*.22,
      -1,
      1
    );
  }


  if(type==="variable"){

    return clamp(
      s*.76 +
      Math.sin(x*.46)*.17 +
      Math.sin(x*1.31)*.07,
      -1,
      1
    );
  }


  if(type==="controlled"){

    return Math.sin(
      x +
      .24*
      Math.sin(x*.48)
    );
  }


  return s;
}


/* =========================================================
   RAF
========================================================= */

function frame(now){

  const dt=
    Math.min(
      (now-lastFrame)/1000,
      .05
    );

  lastFrame=now;


  updateMind(dt);


  const target=
    targetValues();


  /*
    Smooth target transitions.
  */

  rendered.tempo=
    lerp(
      rendered.tempo || target.tempo,
      target.tempo,
      1-Math.exp(-dt*1.55)
    );


  rendered.intensity=
    lerp(
      rendered.intensity || target.intensity,
      target.intensity,
      1-Math.exp(-dt*1.45)
    );


  rendered.inner=
    lerp(
      rendered.inner || target.inner,
      target.inner,
      1-Math.exp(-dt*1.25)
    );


  /*
    Tempo controls continuous frequency.
  */

  const frequency=
    .24 +
    rendered.tempo*.18;


  phase +=
    Math.PI*2*
    frequency*
    dt;


  const p=
    profiles[partnerId];


  const wave=
    (
      waveShape(
        p.motion,
        phase
      ) + 1
    ) / 2;


  /*
    White capsule = external output.
  */

  const intensityNormalized=
    clamp(
      rendered.intensity/10,
      0,
      1
    );


  const minHeight=34;

  const amplitude=
    46 +
    intensityNormalized*108;


  const height=
    minHeight +
    wave*amplitude;


  fill.style.height=
    height+"px";


  fill.classList.toggle(
    "hot",
    target.external>.68
  );


  /*
    Inner shell = mental desire.
    Only visually revealed in backstage.
  */

  const shellHeight=
    52 +
    rendered.inner*150;


  const shellWidth=
    68 +
    rendered.inner*30;


  innerShell.style.height=
    shellHeight+"px";

  innerShell.style.width=
    shellWidth+"px";


  requestAnimationFrame(frame);
}
